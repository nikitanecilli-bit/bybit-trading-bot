name: Bybit public announcement archive inventory

on:
  push:
    branches: [research/bybit-raw-response-evidence-v1]
    paths:
      - 'scripts/collect_bybit_announcements.py'
      - 'scripts/validate_bybit_announcement_content.py'
      - 'tests/test_collect_bybit_announcements.py'
      - 'tests/test_validate_bybit_announcement_content.py'
      - 'scripts/extract_bybit_lifecycle_events.py'
      - 'tests/test_extract_bybit_lifecycle_events.py'
      - '.github/workflows/bybit-announcement-archive-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

# Prevent duplicate full-archive crawls from overlapping manual dispatches.
concurrency:
  group: bybit-announcement-inventory-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-archive]')) && 'full' || 'tests' }}
  cancel-in-progress: true

jobs:
  public-announcement-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline parser and safety tests
        run: |
          python tests/test_collect_bybit_announcements.py
          python tests/test_validate_bybit_announcement_content.py
          python -m py_compile scripts/extract_bybit_lifecycle_events.py
          python tests/test_extract_bybit_lifecycle_events.py
      # Full public crawl requires workflow_dispatch or an explicit [full-archive] push commit marker.
      - name: Collect public Bybit announcement pages only
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-archive]'))
        run: |
          python scripts/collect_bybit_announcements.py \
            --output announcement_inventory \
            --delay 1.0 \
            --timeout 25 \
            --max-pages-per-category 100
      - name: Validate non-empty article content and raw-body integrity
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-archive]'))
        run: python scripts/validate_bybit_announcement_content.py --output announcement_inventory
      - name: Extract listing and delisting event candidates
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-archive]'))
        run: python scripts/extract_bybit_lifecycle_events.py --input announcement_inventory --output announcement_inventory/lifecycle_events.json
      - name: Upload raw HTML and inventory evidence
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-archive]')))
        uses: actions/upload-artifact@v4
        with:
          name: bybit-public-announcement-inventory
          path: announcement_inventory/
          if-no-files-found: warn
          retention-days: 14
