name: Bybit public announcement archive inventory

on:
  push:
    branches: [research/bybit-raw-response-evidence-v1]
    paths:
      - 'scripts/collect_bybit_announcements.py'
      - 'scripts/validate_bybit_announcement_content.py'
      - 'tests/test_collect_bybit_announcements.py'
      - 'tests/test_validate_bybit_announcement_content.py'
      - '.github/workflows/bybit-announcement-archive-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

# Prevent duplicate full-archive crawls from overlapping commits.
concurrency:
  group: bybit-announcement-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-announcement-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline parser and safety tests
        run: |
          python tests/test_collect_bybit_announcements.py
          python tests/test_validate_bybit_announcement_content.py
      - name: Collect public Bybit announcement pages only
        run: |
          python scripts/collect_bybit_announcements.py \
            --output announcement_inventory \
            --delay 1.0 \
            --timeout 25 \
            --max-pages-per-category 100
      - name: Validate non-empty article content and raw-body integrity
        run: python scripts/validate_bybit_announcement_content.py --output announcement_inventory
      - name: Upload raw HTML and inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-public-announcement-inventory
          path: announcement_inventory/
          if-no-files-found: warn
          retention-days: 14
