name: Archive Bybit instrument specifications

on:
  schedule:
    - cron: '17 2 3,17 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-instrument-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download dated linear instrument snapshot
        env:
          BYBIT_API_BASE_URL: ${{ vars.BYBIT_API_BASE_URL || 'https://api.bybit.com' }}
        run: |
          echo "Using configured official Bybit API base URL: $BYBIT_API_BASE_URL"
          python scripts/snapshot_bybit_instruments.py --category linear --base-url "$BYBIT_API_BASE_URL"
      - name: Commit snapshot if changed
        run: |
          if [[ -n "$(git status --porcelain data/instrument_specs/linear)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/instrument_specs/linear
            git commit -m "data: archive Bybit linear instrument specs"
            git push
          else
            echo "Instrument snapshot unchanged; no commit needed."
          fi
