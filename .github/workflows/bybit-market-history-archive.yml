name: Archive Bybit OHLCV, funding and mark-price history

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated linear symbols (e.g. BTCUSDT,ETHUSDT)
        required: true
        type: string
      start_ms:
        description: UTC start timestamp in milliseconds, aligned to H1
        required: true
        type: string
      end_ms:
        description: Exclusive UTC end timestamp in milliseconds, aligned to H1
        required: true
        type: string
      interval:
        description: Mark-price candle interval
        required: true
        default: "60"
        type: choice
        options:
          - "60"

permissions:
  contents: write

concurrency:
  group: bybit-market-history-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official Bybit history
        env:
          SYMBOLS: ${{ inputs.symbols }}
          START_MS: ${{ inputs.start_ms }}
          END_MS: ${{ inputs.end_ms }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          SUCCESS=0
          for BASE_URL in https://api.bybit.com https://api.bytick.com https://api.bybit.kz https://api.bybit.nl https://api.bybit.ae https://api.bybit-tr.com; do
            echo "Trying official Bybit public API endpoint: $BASE_URL"
            if python scripts/archive_bybit_market_history.py --symbols "$SYMBOLS" --start-ms "$START_MS" --end-ms "$END_MS" --interval "$INTERVAL" --base-url "$BASE_URL" --output-root "data/archives/bybit/${START_MS}_${END_MS}_${GITHUB_RUN_ID}"; then
              SUCCESS=1
              break
            fi
            echo "Endpoint failed; trying next supported official host."
          done
          test "$SUCCESS" -eq 1
      - name: Require exact funding-settlement mark coverage
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          python scripts/validate_funding_coverage.py --funding-dir "data/archives/bybit/${{ inputs.start_ms }}_${{ inputs.end_ms }}_${GITHUB_RUN_ID}/funding" --mark-dir "data/archives/bybit/${{ inputs.start_ms }}_${{ inputs.end_ms }}_${GITHUB_RUN_ID}/mark_price" --trade-kline-dir "data/archives/bybit/${{ inputs.start_ms }}_${{ inputs.end_ms }}_${GITHUB_RUN_ID}/kline" --symbols "$SYMBOLS"
      - name: Commit verified archive
        run: |
          if [[ -n "$(git status --porcelain data/archives/bybit)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/archives/bybit
            git commit -m "data: archive Bybit funding and mark-price history"
            git push
          else
            echo "Archive unchanged; no commit needed."
          fi
