name: Bybit official trade archive cross-check
# Manually dispatched bounded sample. Public market data only; no credentials, account data, orders or PnL.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Parquet reader
        run: python -m pip install --quiet pyarrow zstandard
      - name: Compare official Bybit daily trades with CryptoHFTData
        run: python scripts/compare_bybit_official_trade_archive.py /tmp/bybit_official_trade_crosscheck.json
      - name: Upload compact comparison report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-official-trade-crosscheck
          path: /tmp/bybit_official_trade_crosscheck.json
          if-no-files-found: warn
