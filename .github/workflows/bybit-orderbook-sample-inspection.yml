name: Bybit order-book sample integrity inspection

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'scripts/inspect_bybit_orderbook_sample.py'
      - '.github/workflows/bybit-orderbook-sample-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download and inspect one AAVEUSDT L2 archive
        run: python scripts/inspect_bybit_orderbook_sample.py
      - name: Upload compact inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-orderbook-sample-inspection
          path: bybit_orderbook_sample_inspection.json
          if-no-files-found: warn
