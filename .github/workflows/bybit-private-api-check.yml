name: Bybit private API credential check (read-only)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Bybit API region endpoint
        required: true
        type: choice
        default: https://api.bybit.com
        options:
          - https://api.bybit.kz
          - https://api.bybit.com
          - https://api.bytick.com

permissions:
  contents: read

concurrency:
  group: bybit-private-api-check
  cancel-in-progress: false

jobs:
  verify-readonly-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research branch without persisted Git credentials
        uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
          persist-credentials: false

      - name: Diagnose runner egress geography (no credentials)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.request

          try:
              request = urllib.request.Request(
                  "https://ipinfo.io/json",
                  headers={"User-Agent": "bybit-readonly-network-diagnostic/1.0"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  data = json.loads(response.read().decode("utf-8"))
              print("Runner egress country:", data.get("country", "unknown"))
              print("Runner egress region:", data.get("region", "unknown"))
              print("Runner egress organization:", data.get("org", "unknown"))
          except Exception as exc:
              print("Runner egress geolocation unavailable:", type(exc).__name__)
          PY

      - name: Verify Bybit V5 read-only API credentials
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_API_BASE_URL: ${{ inputs.base_url }}
        run: python scripts/bybit_private_api_check.py
