name: Bybit public API smoke test

on:
  push:
    branches:
      - research/bybit-public-api-smoke-test
    paths:
      - .github/workflows/bybit-public-api-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-public-api-smoke-test
  cancel-in-progress: false

jobs:
  public-get-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Bybit V5 market endpoints
        run: |
          python - <<'PY'
          import json
          import socket
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://api.bybit.com"
          COMMON = {"category": "linear", "symbol": "BTCUSDT", "limit": "3"}
          CHECKS = [
              ("H1 trade candles", "/v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=3", "candles"),
              ("H1 mark-price candles", "/v5/market/mark-price-kline?category=linear&symbol=BTCUSDT&interval=60&limit=3", "candles"),
              ("Funding history", "/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=3", "funding"),
          ]

          print("UTC:", datetime.now(timezone.utc).isoformat())
          failures = 0
          for name, path, kind in CHECKS:
              url = BASE + path
              req = urllib.request.Request(url, headers={"User-Agent": "public-market-data-diagnostic/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
                      body = response.read()
                  payload = json.loads(body)
                  code = payload.get("retCode")
                  message = payload.get("retMsg", "")
                  rows = payload.get("result", {}).get("list", [])
                  valid_rows = isinstance(rows, list) and len(rows) > 0
                  valid_shape = valid_rows and all(isinstance(row, list) and len(row) >= 7 for row in rows) if kind == "candles" else valid_rows and all(isinstance(row, dict) and "fundingRate" in row and "fundingRateTimestamp" in row for row in rows)
                  ok = status == 200 and code == 0 and valid_shape
                  print(json.dumps({
                      "check": name,
                      "http_status": status,
                      "retCode": code,
                      "retMsg": message,
                      "rows": len(rows) if isinstance(rows, list) else None,
                      "shape_valid": bool(valid_shape),
                      "result": "PASS" if ok else "FAIL",
                  }, ensure_ascii=False))
                  if not ok:
                      failures += 1
              except urllib.error.HTTPError as exc:
                  print(json.dumps({"check": name, "result": "HTTP_ERROR", "http_status": exc.code, "detail": exc.read(500).decode("utf-8", "replace")}, ensure_ascii=False))
                  failures += 1
              except (urllib.error.URLError, socket.gaierror, TimeoutError) as exc:
                  reason = getattr(exc, "reason", exc)
                  print(json.dumps({"check": name, "result": "NETWORK_ERROR", "detail": str(reason)}, ensure_ascii=False))
                  failures += 1
              except Exception as exc:
                  print(json.dumps({"check": name, "result": "ERROR", "detail": repr(exc)}, ensure_ascii=False))
                  failures += 1

          if failures:
              print(f"SUMMARY: FAIL ({failures}/{len(CHECKS)} checks failed)")
              sys.exit(1)
          print(f"SUMMARY: PASS ({len(CHECKS)}/{len(CHECKS)} public GET checks passed)")
          PY
