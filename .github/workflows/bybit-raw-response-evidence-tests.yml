name: Bybit raw response evidence tests

on:
  workflow_dispatch:
  push:
    branches: [research/bybit-raw-response-evidence-v1]
    paths:
      - 'scripts/archive_bybit_market_history.py'
      - 'tests/test_archive_bybit_market_history.py'
      - '.github/workflows/bybit-raw-response-evidence-tests.yml'

permissions:
  contents: read

jobs:
  offline-evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile collectors, helpers and tests
        run: |
          python -m py_compile scripts/archive_bybit_market_history.py scripts/bybit_raw_evidence.py scripts/snapshot_bybit_instruments.py scripts/snapshot_bybit_linear_universe.py scripts/snapshot_bybit_risk_limits.py
          python -m py_compile tests/test_archive_bybit_market_history.py tests/test_bybit_raw_evidence.py tests/test_snapshot_bybit_instruments.py tests/test_snapshot_bybit_linear_universe.py tests/test_snapshot_bybit_risk_limits.py
      - name: Run offline raw-evidence tests
        run: python tests/test_bybit_raw_evidence.py
      - name: Run instrument snapshot tests
        run: python tests/test_snapshot_bybit_instruments.py
      - name: Run linear universe snapshot tests
        run: python tests/test_snapshot_bybit_linear_universe.py
      - name: Run risk-limit snapshot tests
        run: python tests/test_snapshot_bybit_risk_limits.py
      - name: Run market-history collector tests
        run: python tests/test_archive_bybit_market_history.py
