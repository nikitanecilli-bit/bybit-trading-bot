name: Bybit independent trade archive cross-check
# Compares all 24 UTC hours; records unmatched examples and trade-ID duplicates; no PnL.

on:
  push:
    branches:
      - research/market-regime-v1-main
    paths:
      - "scripts/compare_bybit_trade_archives.py"
      - ".github/workflows/bybit-trade-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Parquet reader
        run: python -m pip install --quiet pyarrow
      - name: Compare Tardis daily trades with CryptoHFTData selected hours
        run: python scripts/compare_bybit_trade_archives.py /tmp/bybit_trade_crosscheck.json
      - name: Upload compact comparison report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-independent-trade-crosscheck
          path: /tmp/bybit_trade_crosscheck.json
          if-no-files-found: warn
