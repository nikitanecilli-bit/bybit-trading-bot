name: CryptoHFTData historical Bybit file probe
on:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - "scripts/probe_cryptohftdata_historical_file.py"
      - ".github/workflows/cryptohftdata-historical-file-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyarrow
      - run: python scripts/probe_cryptohftdata_historical_file.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptohftdata-historical-file-probe
          path: /tmp/cryptohftdata_historical_probe.json
          if-no-files-found: warn
