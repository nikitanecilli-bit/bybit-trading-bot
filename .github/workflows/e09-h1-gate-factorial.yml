name: E09 H1 Gate Factorial
# Re-run after correcting next-open gate isolation.

on:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - "scripts/run_e09_h1_gate_factorial.py"
      - ".github/workflows/e09-h1-gate-factorial.yml"
      - "tests/test_gap_execution.py"
      - "Bybit_Trading_Engine_v14_research.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile research script
        run: python -m py_compile scripts/run_e09_h1_gate_factorial.py
      - name: Run engine gap tests
        run: python -m unittest test_gap_execution -v
      - name: Run E09 factorial
        run: python scripts/run_e09_h1_gate_factorial.py
      - name: Upload E09 results
        uses: actions/upload-artifact@v4
        with:
          name: e09-h1-gate-factorial
          path: |
            e09_gate_factorial_summary.csv
            e09_gate_factorial_trades.csv
            e09_gate_factorial_signals.csv
          if-no-files-found: error
