name: E10 H1 Body Gate Cross-Sectional Replication

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'scripts/run_e10_h1_body_gate_replication.py'
      - '.github/workflows/e10-h1-body-gate-replication.yml'

permissions:
  contents: read

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Record immutable dataset archive hashes
        run: |
          find data/archives/cryptofetch -maxdepth 1 -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum | tee e10_h1_body_gate_archive_sha256.txt
      - name: Compile research script
        run: python -m py_compile scripts/run_e10_h1_body_gate_replication.py
      - name: Run cross-sectional replication
        run: python scripts/run_e10_h1_body_gate_replication.py
      - name: Upload E10 results and manifests
        uses: actions/upload-artifact@v4
        with:
          name: e10-h1-body-gate-cross-sectional
          path: |
            e10_h1_body_gate_summary.csv
            e10_h1_body_gate_trades.csv
            e10_h1_body_gate_signals.csv
            e10_h1_body_gate_universe_manifest.csv
            e10_h1_body_gate_archive_sha256.txt
          if-no-files-found: error
