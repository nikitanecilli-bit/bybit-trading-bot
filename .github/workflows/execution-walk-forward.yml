name: Execution Policy Walk Forward

on:
  workflow_dispatch:
  push:
    branches:
      - research/market-regime-v1-main
    paths:
      - "scripts/run_execution_walk_forward.py"
      - "Bybit_Trading_Engine_v14_research.py"
      - "scripts/run_uploaded_dataset_backtests.py"
      - ".github/workflows/execution-walk-forward.yml"

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py scripts/run_uploaded_dataset_backtests.py scripts/run_execution_walk_forward.py
      - name: Run rolling walk-forward
        run: python scripts/run_execution_walk_forward.py
      - name: Upload walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: execution-policy-walk-forward
          path: execution_walk_forward.csv
          if-no-files-found: error
