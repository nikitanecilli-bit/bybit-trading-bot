name: H-A post-break diagnostics

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed H-A replay run ID whose artifact should be diagnosed"
        required: true
        type: string
        default: "41670116033"
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - '.github/workflows/h-a-post-break-diagnostics.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: h-a-post-break-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download completed H-A replay artifact
        uses: actions/download-artifact@v4
        with:
          name: h-a-preregistered-ohlcv-results
          path: /tmp/h_a_results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.source_run_id || '41670116033' }}
      - name: Compile diagnostic
        run: python -m py_compile scripts/diagnose_h_a_signal_candles.py
      - name: Reconstruct signal and post-break path features
        run: |
          python -u scripts/diagnose_h_a_signal_candles.py \
            --results-dir /tmp/h_a_results \
            --archive-dir data/archives/cryptofetch \
            --output-dir /tmp/h_a_post_break_diagnostics
      - name: Validate diagnostic schema and archive provenance
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("/tmp/h_a_post_break_diagnostics")
          manifest = json.loads((root / "diagnostic_manifest.json").read_text())
          assert manifest["source_archive_manifest_sha256_match"] is True
          assert manifest["trade_rows"] > 0
          with (root / "trade_signal_features.csv").open(newline="") as f:
              fields = set(next(csv.reader(f)))
          assert {"post_entry_3bar_close_return_r", "post_entry_retest_inside_3bars"} <= fields
          with (root / "cohort_summary.csv").open(newline="") as f:
              fields = set(next(csv.reader(f)))
          assert "n_post_entry_3bar_close_return_r" in fields
          print("PASS diagnostic schema, coverage counts and archive provenance")
          PY
      - name: Upload post-break attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-a-post-break-diagnostics
          path: /tmp/h_a_post_break_diagnostics/
          if-no-files-found: error
