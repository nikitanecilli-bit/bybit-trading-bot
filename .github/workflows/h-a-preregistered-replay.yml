name: H-A preregistered OHLCV replay

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - '.github/workflows/h-a-preregistered-replay.yml'

permissions:
  contents: read

concurrency:
  group: h-a-preregistered-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audited engine and H-A runner
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py relative_strength_breakout.py scripts/audit_cryptofetch_archives.py scripts/cryptofetch_sparse_loader.py scripts/run_h_a_relative_strength_replay.py
      - name: Run frozen baseline and H-A across preregistered folds
        run: python -u scripts/run_h_a_relative_strength_replay.py --execute --output-dir /tmp/h_a_relative_strength
      - name: Upload H-A portfolio results and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-a-preregistered-ohlcv-results
          path: /tmp/h_a_relative_strength/
          if-no-files-found: warn
