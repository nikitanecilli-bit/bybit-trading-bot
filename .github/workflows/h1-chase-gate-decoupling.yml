name: H1 Gate Decoupling
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile Bybit_Trading_Engine_v14_research.py scripts/run_uploaded_dataset_backtests.py scripts/run_h1_chase_gate_decoupling.py
      - run: python scripts/run_h1_chase_gate_decoupling.py
      - uses: actions/upload-artifact@v4
        with:
          name: h1-chase-gate-decoupling
          path: |
            h1_chase_gate_decoupling_summary.csv
            h1_chase_gate_decoupling_trades.csv
            h1_chase_gate_decoupling_signals.csv
          if-no-files-found: error
