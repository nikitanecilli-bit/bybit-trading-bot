name: H1 Max-Chase Threshold Ablation

on:
  workflow_dispatch:
  push:
    branches:
      - research/market-regime-v1-main
    paths:
      - "scripts/run_h1_chase_limit_ablation.py"
      - "Bybit_Trading_Engine_v14_research.py"
      - "scripts/run_uploaded_dataset_backtests.py"
      - ".github/workflows/h1-chase-limit-ablation.yml"

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py scripts/run_uploaded_dataset_backtests.py scripts/run_h1_chase_limit_ablation.py
      - name: Run max-chase threshold ablation
        run: python scripts/run_h1_chase_limit_ablation.py
      - name: Upload ablation tables
        uses: actions/upload-artifact@v4
        with:
          name: h1-chase-limit-ablation
          path: |
            h1_chase_limit_ablation.csv
            h1_chase_limit_trades.csv
            h1_chase_limit_signals.csv
          if-no-files-found: error
