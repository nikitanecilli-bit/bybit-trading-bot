name: H1 Direction and Execution Ablation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py scripts/run_uploaded_dataset_backtests.py scripts/run_h1_direction_execution_ablation.py
      - name: Run frozen H1 ablation
        run: python scripts/run_h1_direction_execution_ablation.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: h1-direction-execution-ablation
          path: h1_direction_execution_ablation.csv
          if-no-files-found: error
