name: H1 causal filter exit attribution

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'scripts/analyze_h1_filter_exit_attribution.py'
      - '.github/workflows/h1-filter-exit-attribution.yml'

permissions:
  contents: read

jobs:
  exit-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run H1 filter exit attribution
        run: |
          set -o pipefail
          python scripts/analyze_h1_filter_exit_attribution.py | tee h1_filter_exit_attribution.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h1-filter-exit-attribution
          path: h1_filter_exit_attribution.txt
          if-no-files-found: error
