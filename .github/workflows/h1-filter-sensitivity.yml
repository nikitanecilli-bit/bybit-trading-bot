name: H1 predeclared causal filter sensitivity

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'scripts/test_h1_predeclared_causal_filters.py'
      - '.github/workflows/h1-filter-sensitivity.yml'

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run frozen causal filter comparison
        run: |
          set -o pipefail
          python scripts/test_h1_predeclared_causal_filters.py | tee h1_filter_sensitivity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h1-predeclared-filter-sensitivity
          path: h1_filter_sensitivity.txt
          if-no-files-found: error
