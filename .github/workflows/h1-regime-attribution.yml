name: H1 causal regime trade attribution

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run trade-level regime attribution
        run: |
          set -o pipefail
          python scripts/analyze_h1_regime_trade_attribution.py | tee h1_regime_attribution.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h1-regime-trade-attribution
          path: h1_regime_attribution.txt
          if-no-files-found: error
