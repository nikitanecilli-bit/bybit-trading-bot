name: H1 Shared-Capital Portfolio Validation

on:
  workflow_dispatch:
    inputs:
      funding_dir:
        description: "Repository path to merged Bybit funding CSVs (one <SYMBOL>.csv per symbol)"
        required: true
        type: string
      mark_price_dir:
        description: "Repository path to merged Bybit mark-price CSVs (one <SYMBOL>.csv per symbol)"
        required: true
        type: string
      kline_dir:
        description: "Repository path to official Bybit H1 trade-kline CSVs (one <SYMBOL>.csv per symbol)"
        required: true
        type: string
      selection_mode:
        description: "Original Top-5 selection or separately registered BTCUSDT-only route"
        required: true
        type: choice
        options: [top5, btc_single]
        default: top5
      selection_manifest:
        description: "Frozen manifest path; required for top5 and generated by this workflow for btc_single"
        required: false
        type: string
      universe_snapshot:
        description: "Official Bybit linear lifecycle snapshot path; required for btc_single"
        required: false
        type: string
      max_market_state_skew_ms:
        description: "Required maximum timestamp skew between instrument-spec and risk-tier snapshots, in milliseconds"
        required: true
        type: string
      validation_mode:
        description: "Explore = grid on folds 1-2 only; confirm = one frozen configuration on final fold 3 only"
        required: true
        type: choice
        options: [explore, confirm]
        default: explore
      ema50_200_comparison:
        description: "Paired ablation: run baseline and EMA50/200-up-gated variants on identical folds"
        required: true
        type: choice
        options: [off, paired]
        default: off
      donchian48_ema_ablation:
        description: "Preregistered three-arm comparison: Donchian20, Donchian48, Donchian48+EMA50/200"
        required: true
        type: choice
        options: [off, paired]
        default: off
      frozen_min_volume_ratio:
        description: "Required in confirm mode; select one predeclared grid value"
        required: false
        type: string
      frozen_min_breakout_atr:
        description: "Required in confirm mode; select one predeclared grid value"
        required: false
        type: string
      frozen_strategy_mode:
        description: "Required in confirm mode; must match the frozen strategy arm set"
        required: false
        type: string

permissions:
  contents: read

jobs:
  portfolio-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py scripts/run_uploaded_dataset_backtests.py scripts/run_h1_shared_capital_portfolio_validation.py scripts/create_h1_btc_single_symbol_manifest.py
      - name: Require official Bybit H1 trade-kline archive
        env:
          KLINE_DIR: ${{ inputs.kline_dir }}
        run: |
          test -d "$KLINE_DIR" && test -n "$(find "$KLINE_DIR" -maxdepth 1 -name '*.csv' -print -quit)" || {
            echo "Missing official Bybit H1 trade-kline archive; refusing Binance/CryptoFetch proxy PnL replay."
            exit 1
          }
      - name: Require Bybit funding and mark-price archives
        env:
          FUNDING_DIR: ${{ inputs.funding_dir }}
          MARK_PRICE_DIR: ${{ inputs.mark_price_dir }}
        run: |
          test -d "$FUNDING_DIR" && test -n "$(find "$FUNDING_DIR" -maxdepth 1 -name '*.csv' -print -quit)" || {
            echo "Missing Bybit funding CSV archive; refusing zero-funding PnL replay."
            exit 1
          }
          test -d "$MARK_PRICE_DIR" && test -n "$(find "$MARK_PRICE_DIR" -maxdepth 1 -name '*.csv' -print -quit)" || {
            echo "Missing Bybit mark-price CSV archive; refusing PnL replay without mark data."
            exit 1
          }
      - name: Require official dated Bybit execution snapshots
        run: |
          test -n "$(find data/instrument_specs/linear -maxdepth 1 -name '*.json' -print -quit 2>/dev/null)" || {
            echo "Missing dated Bybit instrument specs; refusing legacy notional-proxy PnL replay."
            exit 1
          }
          test -n "$(find data/instrument_specs/risk_limits -maxdepth 1 -name '*.json' -print -quit 2>/dev/null)" || {
            echo "Missing dated Bybit risk tiers; refusing legacy notional-proxy PnL replay."
            exit 1
          }
      - name: Derive the exact frozen allowlist and selection mode
        env:
          SELECTION_MODE: ${{ inputs.selection_mode }}
          SELECTION_MANIFEST: ${{ inputs.selection_manifest }}
        run: |
          python - <<'PY'
          import json, os
          mode = os.environ["SELECTION_MODE"]
          if mode == "btc_single":
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("H1_SYMBOL_ALLOWLIST=BTCUSDT\n")
                  env.write("H1_SELECTION_MANIFEST=/tmp/h1_btc_single_selection_manifest.json\n")
              print("BTCUSDT-only route selected; manifest preparation follows")
          else:
              path = os.environ["SELECTION_MANIFEST"]
              if not path:
                  raise SystemExit("Top-five mode requires selection_manifest")
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              symbols = payload.get("primary")
              if payload.get("selection_status") != "ok" or not isinstance(symbols, list) or len(symbols) != 5 or len(set(symbols)) != 5:
                  raise SystemExit("Top-five manifest must contain exactly five unique approved primary symbols")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write("H1_SYMBOL_ALLOWLIST=" + ",".join(symbols) + "\n")
                  env.write("H1_SELECTION_MANIFEST=" + path + "\n")
              print("Frozen top-five: " + ",".join(symbols))
          PY
      - name: Prepare BTCUSDT-only manifest without running PnL
        if: inputs.selection_mode == 'btc_single'
        env:
          KLINE_DIR: ${{ inputs.kline_dir }}
          FUNDING_DIR: ${{ inputs.funding_dir }}
          MARK_PRICE_DIR: ${{ inputs.mark_price_dir }}
          UNIVERSE_SNAPSHOT: ${{ inputs.universe_snapshot }}
        run: |
          test -n "$UNIVERSE_SNAPSHOT" || { echo "btc_single requires universe_snapshot"; exit 1; }
          python scripts/create_h1_btc_single_symbol_manifest.py \
            --kline-dir "$KLINE_DIR" \
            --funding-dir "$FUNDING_DIR" \
            --mark-price-dir "$MARK_PRICE_DIR" \
            --instrument-specs-dir data/instrument_specs/linear \
            --risk-tiers-dir data/instrument_specs/risk_limits \
            --universe-snapshot "$UNIVERSE_SNAPSHOT" \
            --output /tmp/h1_btc_single_selection_manifest.json
      - name: Run strict shared-capital portfolio validation
        env:
          BYBIT_INSTRUMENT_SPECS_DIR: data/instrument_specs/linear
          BYBIT_RISK_TIERS_DIR: data/instrument_specs/risk_limits
          BYBIT_FUNDING_DIR: ${{ inputs.funding_dir }}
          BYBIT_MARK_PRICE_DIR: ${{ inputs.mark_price_dir }}
          BYBIT_KLINE_DIR: ${{ inputs.kline_dir }}
          BYBIT_MAX_MARKET_STATE_SKEW_MS: ${{ inputs.max_market_state_skew_ms }}
          H1_SELECTION_MODE: ${{ inputs.selection_mode }}
          H1_VALIDATION_MODE: ${{ inputs.validation_mode }}
          H1_EMA50_200_GATE: ${{ inputs.ema50_200_comparison == 'paired' && '1' || '0' }}
          H1_DONCHIAN48_EMA_ABLATION: ${{ inputs.donchian48_ema_ablation == 'paired' && '1' || '0' }}
          H1_FROZEN_MIN_VOLUME_RATIO: ${{ inputs.frozen_min_volume_ratio }}
          H1_FROZEN_MIN_BREAKOUT_ATR: ${{ inputs.frozen_min_breakout_atr }}
          H1_FROZEN_STRATEGY_MODE: ${{ inputs.frozen_strategy_mode }}
          BYBIT_API_BASE_URL: ${{ vars.BYBIT_API_BASE_URL || 'https://api.bybit.com' }}
        run: python scripts/run_h1_shared_capital_portfolio_validation.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: h1-shared-capital-portfolio-validation
          path: |
            h1_shared_capital_portfolio_validation.csv
            h1_shared_capital_portfolio_validation_manifest.json
          if-no-files-found: error
