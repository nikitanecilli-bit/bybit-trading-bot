name: OKX Funding Archive Catalog Probe

on:
  push:
    branches:
      - research/okx-public-data-loader
    paths:
      - scripts/okx_funding_archive_catalog.py
      - .github/workflows/okx-funding-archive-catalog.yml

permissions:
  contents: read

jobs:
  catalog-public-funding-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/okx-public-data-loader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Query official OKX public archive catalog
        run: python scripts/okx_funding_archive_catalog.py

      - name: Upload catalog response and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-btc-usdt-swap-funding-archive-catalog
          path: data/archives/okx/funding-catalog/BTC-USDT-SWAP/
          if-no-files-found: warn
          retention-days: 7
