name: Preliminary Bybit BTC H1 backtest

on:
  push:
    branches:
      - research/h1-volume-lookback-provenance-fix
    paths:
      - scripts/preliminary_bybit_btc_h1_backtest.py
      - .github/workflows/preliminary-bybit-btc-h1-backtest.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h1-volume-lookback-provenance-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download full existing Bybit official public H1 history
        env:
          START_DATE: "2020-04-01"
          END_DATE: "2025-11-04"
        run: python scripts/download_bybit_btcusdt_public_history.py
      - name: Run preliminary Bybit-only H1 replay
        run: python scripts/preliminary_bybit_btc_h1_backtest.py
      - name: Upload preliminary backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: preliminary-bybit-btc-h1-backtest
          path: preliminary_backtest/
          if-no-files-found: error
          retention-days: 90
