name: Initial stop ATR sensitivity

on:
  push:
    branches:
      - research/h1-volume-lookback-provenance-fix
    paths:
      - scripts/preliminary_bybit_btc_h1_backtest.py
      - scripts/preliminary_bybit_initial_stop_sensitivity.py
      - scripts/download_bybit_btcusdt_public_history.py
      - .github/workflows/preliminary-bybit-initial-stop-sensitivity.yml

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h1-volume-lookback-provenance-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official Bybit BTCUSDT H1 history
        env:
          SYMBOL: BTCUSDT
          OUT_DIR: bybit_btcusdt_initial
          START_DATE: "2020-04-01"
          END_DATE: "2025-11-04"
        run: python scripts/download_bybit_btcusdt_public_history.py
      - name: Download official Bybit ETHUSDT H1 history
        env:
          SYMBOL: ETHUSDT
          OUT_DIR: bybit_ethusdt_initial
          START_DATE: "2020-04-01"
          END_DATE: "2025-11-04"
        run: python scripts/download_bybit_btcusdt_public_history.py
      - name: Run initial stop ATR sensitivity
        run: python scripts/preliminary_bybit_initial_stop_sensitivity.py
      - name: Upload stop sensitivity results
        uses: actions/upload-artifact@v4
        with:
          name: preliminary-bybit-initial-stop-sensitivity
          path: stop_sensitivity/
          if-no-files-found: error
          retention-days: 90
