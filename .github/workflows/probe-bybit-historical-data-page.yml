name: Inspect Bybit official historical data catalog

on:
  push:
    branches:
      - research/market-regime-v1-main
    paths:
      - scripts/probe_bybit_historical_data_page.py
      - .github/workflows/probe-bybit-historical-data-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/market-regime-v1-main
      - name: Inspect official public catalog page
        run: python scripts/probe_bybit_historical_data_page.py
      - name: Upload catalog inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-historical-data-page-probe
          path: bybit_history_page_probe/
          if-no-files-found: warn
          retention-days: 14
