name: Research engine checks

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'Bybit_Trading_Engine_v14_research.py'
      - 'test_*.py'
      - '.github/workflows/research-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile engine and deterministic tests
        run: python -m py_compile market_regime.py market_structure.py test_market_regime.py test_market_structure.py test_regime_analysis.py test_regime_gate_holdout.py Bybit_Trading_Engine_v14_research.py bybit_downloader.py test_time_model.py test_gap_execution.py test_timeframe_validation.py test_portfolio_accounting.py bybit_instrument_specs.py test_bybit_instrument_specs.py scripts/snapshot_bybit_instruments.py test_snapshot_bybit_instruments.py funding_accounting.py test_funding_accounting.py test_funding_pnl.py test_funding_mark_to_market.py scripts/scan_secrets.py
      - name: Test Bybit instrument constraints and Decimal rounding
        run: python test_bybit_instrument_specs.py
      - name: Test dated Bybit instrument snapshot collector
        run: python test_snapshot_bybit_instruments.py
      - name: Test cumulative funding accounting boundaries
        run: python test_funding_accounting.py
      - name: Test v14 realized funding accounting
        run: python test_funding_pnl.py
      - name: Test v14 mark-to-market funding risk
        run: python test_funding_mark_to_market.py
      - name: Scan for obvious secrets
        run: python scripts/scan_secrets.py .
      - name: Test causal market-regime classifier
        run: python test_market_regime.py
      - name: Test causal trend and breakout filters
        run: python test_market_structure.py
      - name: Test regime analysis report helpers
        run: python test_regime_analysis.py
      - name: Test frozen regime gate
        run: python test_regime_gate_holdout.py
      - name: Test gap execution
        run: python test_gap_execution.py
      - name: Test time model
        run: python test_time_model.py
      - name: Test configured candle timeframe validation
        run: python test_timeframe_validation.py
      - name: Test portfolio accounting and risk budget
        run: python test_portfolio_accounting.py
