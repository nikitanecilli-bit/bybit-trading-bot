name: Research engine checks
# Rerun trigger for ENG-PERSIST-001 after test-fixture initialization

on:
  workflow_dispatch:
  push:
    branches: [research/market-regime-v1-main]
    paths:
      - 'Bybit_Trading_Engine_v14_research.py'
      - 'bybit_instrument_specs.py'
      - 'instrument_spec_history.py'
      - 'exchange_order_sizing.py'
      - 'funding_accounting.py'
      - 'bybit_reconciliation.py'
      - 'scripts/bybit_reconciliation_snapshot.py'
      - 'tests/test_bybit_reconciliation_snapshot.py'
      - 'scripts/bybit_reconciliation_report.py'
      - 'tests/test_bybit_reconciliation_report.py'
      - 'scripts/snapshot_bybit_instruments.py'
      - 'scripts/snapshot_bybit_risk_limits.py'
      - 'scripts/archive_bybit_market_history.py'
      - 'tests/test_archive_bybit_market_history.py'
      - 'tests/test_snapshot_bybit_risk_limits.py'
      - 'scripts/bybit_private_api_check.py'
      - '.github/workflows/bybit-private-api-check.yml'
      - 'scripts/validate_funding_coverage.py'
      - 'tests/**'
      - '.github/workflows/research-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile engine and deterministic tests
        run: python -m py_compile market_regime.py market_structure.py tests/test_market_regime.py tests/test_market_structure.py tests/test_regime_analysis.py tests/test_regime_gate_holdout.py Bybit_Trading_Engine_v14_research.py bybit_downloader.py tests/test_time_model.py tests/test_gap_execution.py tests/test_timeframe_validation.py tests/test_portfolio_accounting.py tests/test_state_persistence.py bybit_instrument_specs.py tests/test_bybit_instrument_specs.py instrument_spec_history.py tests/test_instrument_spec_history.py exchange_order_sizing.py tests/test_exchange_order_sizing.py scripts/snapshot_bybit_instruments.py tests/test_snapshot_bybit_instruments.py scripts/snapshot_bybit_risk_limits.py tests/test_snapshot_bybit_risk_limits.py scripts/archive_bybit_market_history.py tests/test_archive_bybit_market_history.py funding_accounting.py tests/test_funding_accounting.py tests/test_funding_pnl.py tests/test_funding_mark_to_market.py scripts/validate_funding_coverage.py tests/test_funding_coverage.py scripts/bybit_private_api_check.py tests/test_bybit_private_api_check.py bybit_reconciliation.py tests/test_bybit_reconciliation.py scripts/bybit_reconciliation_snapshot.py tests/test_bybit_reconciliation_snapshot.py scripts/bybit_reconciliation_report.py tests/test_bybit_reconciliation_report.py scripts/scan_secrets.py
      - name: Test Bybit instrument constraints and Decimal rounding
        run: python tests/test_bybit_instrument_specs.py
      - name: Test dated Bybit instrument snapshot collector
        run: python tests/test_snapshot_bybit_instruments.py
      - name: Test dated Bybit risk-limit tier snapshot collector
        run: python tests/test_snapshot_bybit_risk_limits.py
      - name: Test Bybit funding and mark history archive collector
        run: python tests/test_archive_bybit_market_history.py
      - name: Test as-of instrument spec history
        run: python tests/test_instrument_spec_history.py
      - name: Test exchange-valid quantity sizing
        run: python tests/test_exchange_order_sizing.py
      - name: Test cumulative funding accounting boundaries
        run: python tests/test_funding_accounting.py
      - name: Test v14 realized funding accounting
        run: python tests/test_funding_pnl.py
      - name: Test v14 mark-to-market funding risk
        run: python tests/test_funding_mark_to_market.py
      - name: Test funding/mark coverage preflight
        run: python tests/test_funding_coverage.py
      - name: Test Bybit private API signature and read-only checks
        run: python tests/test_bybit_private_api_check.py
      - name: Test read-only Bybit V5 reconciliation snapshot parser
        run: python tests/test_bybit_reconciliation.py
      - name: Test fail-closed read-only Bybit snapshot collector
        run: python tests/test_bybit_reconciliation_snapshot.py
      - name: Test fail-closed report-only reconciliation comparator
        run: python tests/test_bybit_reconciliation_report.py
      - name: Scan for obvious secrets
        run: python scripts/scan_secrets.py .
      - name: Test causal market-regime classifier
        run: python tests/test_market_regime.py
      - name: Test causal trend and breakout filters
        run: python tests/test_market_structure.py
      - name: Test regime analysis report helpers
        run: python tests/test_regime_analysis.py
      - name: Test frozen regime gate
        run: python tests/test_regime_gate_holdout.py
      - name: Test gap execution
        run: python tests/test_gap_execution.py
      - name: Test time model
        run: python tests/test_time_model.py
      - name: Test configured candle timeframe validation
        run: python tests/test_timeframe_validation.py
      - name: Test portfolio accounting and risk budget
        run: python tests/test_portfolio_accounting.py
      - name: Test fail-closed state persistence
        run: python tests/test_state_persistence.py
