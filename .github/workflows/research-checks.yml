name: Research engine checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile Bybit_Trading_Engine_v14_research.py bybit_downloader.py test_time_model.py test_gap_execution.py test_v15_donchian_signal.py test_v15_backtest.py research_v15/donchian_signal.py research_v15/backtest.py scripts/scan_secrets.py scripts/run_uploaded_dataset_backtests.py scripts/run_v15_h1_backtest.py test_v15_portfolio.py research_v15/portfolio.py test_v15_portfolio_replay.py research_v15/portfolio_replay.py
      - name: Scan for obvious secrets
        run: python scripts/scan_secrets.py .
      - name: Backtest uploaded historical datasets
        run: python scripts/run_uploaded_dataset_backtests.py
      - name: Validate H1 candidates on chronological holdout
        run: python scripts/run_h1_walk_forward.py
      - name: Test gap execution
        run: python test_gap_execution.py
      - name: Test time model
        run: python test_time_model.py
      - name: Test v15 Donchian signal
        run: python test_v15_donchian_signal.py

      - name: Test v15 simulator
        run: python test_v15_backtest.py
      - name: Test v15 portfolio risk guardrails
        run: python test_v15_portfolio.py
      - name: Test v15 portfolio replay
        run: python test_v15_portfolio_replay.py
      - name: Run v15 H1 diagnostic backtest
        run: python scripts/run_v15_h1_backtest.py