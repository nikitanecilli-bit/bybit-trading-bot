<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Engine: аналитика торгового робота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050912; --glass:rgba(14,23,41,.62); --glass-2:rgba(255,255,255,.035);
  --line:rgba(148,197,255,.10); --line-2:rgba(34,211,238,.26);
  --text:#e6edf7; --mute:#8d9db7; --dim:#7a89a4;--sel:#2563eb;--sel-text:#8dbbff;--up-rgb:52,211,153;--down-rgb:251,113,133;
  --cyan:#22d3ee; --azure:#3b82f6; --up:#34d399; --down:#fb7185; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 520px at 6% -6%,rgba(34,211,238,.10),transparent 62%),
  radial-gradient(820px 620px at 104% 104%,rgba(59,130,246,.13),transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}

/* каркас */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh;position:relative}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-right:1px solid var(--line);background:rgba(6,12,24,.6);backdrop-filter:blur(18px);z-index:20}
.rail-logo{width:42px;height:42px;margin-bottom:14px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,rgba(34,211,238,.22),rgba(59,130,246,.18));border:1px solid var(--line-2);box-shadow:0 0 24px -4px rgba(34,211,238,.45)}
.rail-btn{width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;color:var(--mute);background:none;border:0;font-size:12px;line-height:1.2;text-align:center}
.rail-btn svg{width:20px;height:20px}
.rail-btn:hover{color:var(--text)}
.rail-btn[aria-selected="true"]{color:var(--sel-text);background:linear-gradient(90deg,rgba(37,99,235,.26),rgba(37,99,235,.03));box-shadow:inset 2px 0 0 #3b82f6}
.main{padding:20px 28px 40px;max-width:1720px;width:100%;margin:0 auto;position:relative;z-index:1}

/* верхняя панель */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--glass-2);color:var(--mute)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn)}
.chip.live{color:var(--up);border-color:rgba(var(--up-rgb),.28);background:rgba(var(--up-rgb),.07)}
.chip.live i{background:var(--up);box-shadow:0 0 10px var(--up)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);color:var(--text);font-weight:500;font-size:12.5px;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(148,197,255,.22)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);border-color:transparent;box-shadow:0 6px 20px -6px rgba(59,130,246,.6)}
.btn.primary:hover{background:linear-gradient(135deg,#2f6df0,#4a8dff)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;width:100%}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
.seg button,.tchip{border:0;background:none;color:var(--mute);padding:5px 13px;border-radius:999px;font-weight:500;font-size:12px;transition:color .15s,background .15s}
.seg button:hover,.tchip:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff;box-shadow:0 4px 14px -2px rgba(59,130,246,.55)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--glass-2)}
.tchip[aria-pressed="true"]{color:var(--sel-text);border-color:rgba(141,187,255,.45);background:rgba(37,99,235,.2)}
.field{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:12px}
.field input{width:104px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);outline:none;font-size:12.5px}
.field input:focus{border-color:var(--line-2)}

/* карточки и сетка */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(18px);min-width:0;position:relative}
.card.hero{border-color:rgba(34,211,238,.24);box-shadow:0 0 70px -24px rgba(34,211,238,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.005em}
.card .sub{color:var(--mute);font-size:12px;margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tile{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;min-width:0}
.tile .lbl{color:var(--mute);font-size:12px}
.tile .val{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:3px 0 1px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--glass-2)}
.badge.down{color:var(--down);border-color:rgba(var(--down-rgb),.32);background:rgba(var(--down-rgb),.09)}
.badge.warn{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.badge.low{color:var(--cyan);border-color:var(--line-2);background:rgba(34,211,238,.07)}
.badge.up{color:var(--up);border-color:rgba(var(--up-rgb),.3);background:rgba(var(--up-rgb),.08)}

/* KPI */
.kpi{padding:16px 16px 0;overflow:hidden;display:flex;flex-direction:column}
.kpi .lbl{color:var(--mute);font-size:12.5px}
.kpi-val{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.2}
.kpi-sub{font-size:12px;color:var(--mute);min-height:18px}
.delta{font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.spark{display:block;width:calc(100% + 32px);height:38px;margin:8px -16px 0}

/* графики */
.ch-main{height:290px;position:relative}
.ch-bars{height:78px;position:relative;margin-top:2px}
.ch-md{height:260px;position:relative}
.ch-sm{height:320px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.legend i.g{background:repeating-linear-gradient(90deg,#b9c4d6 0 5px,transparent 5px 8px);box-shadow:none}
.legend i.l{height:10px;width:16px;border-radius:3px;background:rgba(251,191,36,.5);box-shadow:none}.legend i.b{height:12px;width:8px;border-radius:2px;background:linear-gradient(var(--up) 50%,var(--down) 50%);box-shadow:none}
.eq-val{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

/* индекс здоровья */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(34,211,238,.45))}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:34px;font-weight:650;letter-spacing:-.03em;line-height:1}
.ring .c span{font-size:12px;color:var(--mute);margin-top:3px}
.parts{flex:1;display:grid;gap:9px;min-width:0}
.part{display:grid;gap:4px;font-size:12px}
.part div:first-child{display:flex;justify-content:space-between;color:var(--mute)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--azure),var(--cyan))}
.focus{margin-top:16px;padding:13px 14px;border-radius:12px;border:1px solid rgba(var(--down-rgb),.25);background:linear-gradient(135deg,rgba(var(--down-rgb),.09),rgba(var(--down-rgb),.02))}
.focus.ok{border-color:rgba(var(--up-rgb),.25);background:linear-gradient(135deg,rgba(var(--up-rgb),.09),rgba(var(--up-rgb),.02))}
.focus b{display:block;font-weight:600;margin:2px 0 8px}
.link{border:0;background:none;color:var(--sel-text);font-weight:600;font-size:12.5px;padding:0}
.link:hover{text-decoration:underline}

/* списки */
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid rgba(148,197,255,.06)}
.row:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 55% / .16);color:hsl(var(--h) 80% 72%);border:1px solid hsl(var(--h) 70% 60% / .28)}
.row .t{font-weight:600}
.row .m{font-size:12px;color:var(--mute)}
.row .v{font-weight:600;text-align:right}
.insight{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid rgba(148,197,255,.06)}
.insight:last-child{border-bottom:0}
.insight .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--cyan);box-shadow:0 0 10px currentColor}
.insight .dot.up{background:var(--up);color:var(--up)}.insight .dot.down{background:var(--down);color:var(--down)}.insight .dot.warn{background:var(--warn);color:var(--warn)}
.insight b{font-weight:600}
.rowbar{display:grid;grid-template-columns:34px 112px minmax(0,1fr) 88px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(148,197,255,.06)}
.rowbar:last-child{border-bottom:0}
.rowbar .v{text-align:right;font-weight:600}
.rowbar .bar i.neg{background:var(--down)}

/* узкие места */
.bn-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px}
.bn-head h2{font-size:21px;font-weight:650;letter-spacing:-.015em;margin:10px 0 4px;max-width:720px}
.bn-nums{display:flex;gap:34px}
.tile h4{font-size:13px;font-weight:600;margin-bottom:8px}
.tile ul{list-style:none;display:grid;gap:7px;color:#c3cee0}
.tile li{padding-left:14px;position:relative}
.tile li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.tile p{color:#c3cee0}

/* таблицы */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{position:sticky;top:0;color:var(--mute);font-weight:500;font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(10,17,32,.9)}
th button{background:none;border:0;color:inherit;font-weight:inherit;display:inline-flex;gap:5px;align-items:center}
th button:hover{color:var(--text)}
td{padding:9px 12px;border-bottom:1px solid rgba(148,197,255,.06);white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.025)}
td.r,th.r{text-align:right}
.cell-bar{display:flex;align-items:center;gap:10px;min-width:150px}
.cell-bar .bar{flex:1}
.cell-bar .bar i{background:linear-gradient(90deg,#f43f5e,var(--down))}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.search input{width:240px;padding:7px 14px 7px 34px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);outline:none}
.search input:focus{border-color:var(--line-2)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--mute)}
.pager button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass-2)}
.pager button:disabled{opacity:.35;cursor:default}
.pager svg{width:15px;height:15px}

/* тепловая карта */
.heat{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:5px;font-size:12px}
.heat .h{color:var(--dim);text-align:center;align-self:center}
.heat .c{height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.04)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.empty{text-align:center;padding:64px 20px;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.donut{position:relative;height:200px}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .c b{font-size:28px;font-weight:650;letter-spacing:-.02em}
.donut .c span{color:var(--mute);font-size:12px}

/* toast + drop */
.toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:360px;padding:12px 16px;border-radius:14px;background:rgba(9,16,30,.95);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:rgba(var(--down-rgb),.45)}
body.drag::after{content:"Отпустите JSON-файл, чтобы загрузить журнал";position:fixed;inset:14px;z-index:60;display:grid;place-items:center;font-size:18px;font-weight:600;border:2px dashed var(--cyan);border-radius:22px;background:rgba(5,9,18,.82);backdrop-filter:blur(6px)}


/* графики на SVG */
.cv{position:absolute;inset:0}
.cv-s{position:absolute;inset:0}
.cv svg{display:block;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s cubic-bezier(.3,.6,.2,1) .1s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.tip{position:absolute;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;background:rgba(8,14,28,.96);border:1px solid rgba(34,211,238,.3);border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.55;color:#c3cee0;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tip b{color:#e6edf7;font-weight:600}.tip b.up{color:var(--up)}.tip b.down{color:var(--down)}


/* ---- правки по результатам UI-аудита ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{margin-bottom:10px}
.filters{position:sticky;top:0;z-index:15;margin:0 0 14px;padding:10px 0;background:rgba(5,9,18,.88);backdrop-filter:blur(14px)}
.tchips{max-height:92px;overflow:auto}
.notice{display:grid;gap:8px;margin-bottom:14px}
.notice:empty{display:none;margin:0}
.nt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);line-height:1.5}
.nt.info{border-color:rgba(141,187,255,.38);background:rgba(37,99,235,.13)}
.nt.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.nt.ok{border-color:rgba(var(--up-rgb),.32);background:rgba(var(--up-rgb),.07)}
.nt>span:first-child{flex:1 1 420px;min-width:0}
.nt .acts{display:flex;gap:8px;flex-wrap:wrap}
.nt .acts button{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:5px 13px;color:var(--sel-text);font-weight:500;font-size:12.5px;min-height:32px}
.busypill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:none;padding:8px 18px;border-radius:999px;background:rgba(9,16,30,.97);border:1px solid var(--line-2);font-weight:500}
body.busy .busypill{display:block}body.busy{cursor:progress}
dialog{margin:auto;border:1px solid var(--line-2);border-radius:20px;background:#0b1220;color:var(--text);padding:22px 24px;max-width:min(780px,calc(100vw - 28px));width:100%;box-shadow:0 30px 80px rgba(0,0,0,.65)}
dialog::backdrop{background:rgba(2,5,12,.72);backdrop-filter:blur(3px)}
dialog h2{font-size:18px;margin-bottom:10px;font-weight:650}
dialog .dlg-b{max-height:62vh;overflow:auto;line-height:1.55}
dialog td{white-space:normal;vertical-align:top}dialog td:first-child{white-space:nowrap}dialog .tbl-wrap{background:none;overflow-x:auto}dialog :focus{outline-offset:2px}
dialog .row-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.danger{border-color:rgba(var(--down-rgb),.5);color:var(--down)}
.btn[hidden]{display:none}

body.cvd{--up:#3b9bff;--down:#ff9f43;--warn:#b794f6;--up-rgb:59,155,255;--down-rgb:255,159,67}
.mctl,.sheet-h,.backdrop,.jsel,.jcards{display:none}
.range{color:var(--mute);font-size:12px;margin-top:1px}
.brand h1{line-height:1.2}
.btn.icon{padding:8px 11px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--sel);color:#fff;font-size:12px;font-weight:600}
.cnt[hidden]{display:none}
.stack{display:grid;gap:16px;align-content:start}
.focus-card{border-color:rgba(var(--down-rgb),.32);background:linear-gradient(135deg,rgba(var(--down-rgb),.11),var(--glass))}
.focus-card.ok{border-color:rgba(var(--up-rgb),.3);background:linear-gradient(135deg,rgba(var(--up-rgb),.1),var(--glass))}
.focus-card h3{font-size:16px;margin:10px 0 4px;letter-spacing:-.01em}
.focus-card .btn{margin-top:12px;border-color:rgba(141,187,255,.4);color:var(--sel-text)}
.term{display:inline;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:help;border-bottom:1px dotted rgba(141,187,255,.55);text-align:left}
.term i{font-style:normal;color:var(--sel-text);font-size:12px;margin-left:4px}
#gtip{position:fixed;z-index:70;max-width:270px;padding:10px 12px;border-radius:11px;background:rgba(8,14,28,.97);border:1px solid rgba(141,187,255,.35);color:#c3cee0;font-size:12.5px;line-height:1.5;box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .12s}
#gtip.show{opacity:1}
[data-tip]{cursor:default}
.bar.div{position:relative;overflow:visible}
.bar.div::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(230,237,247,.35)}
.bar.div i{position:absolute;top:0;bottom:0}
.bar.div i.pos{left:50%;border-radius:0 99px 99px 0;background:var(--up)}
.bar.div i.neg{right:50%;border-radius:99px 0 0 99px}
.hlegend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--mute)}
.hlegend i{flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(var(--down-rgb),.85),rgba(var(--down-rgb),.12) 44%,rgba(255,255,255,.05) 50%,rgba(var(--up-rgb),.12) 56%,rgba(var(--up-rgb),.85))}

<script>
/*LOGIC_START*/
addEventListener('error',e=>{try{toast('Ошибка скрипта: '+(e.message||'неизвестная')+(e.lineno?' (строка '+e.lineno+')':''),true)}catch(_){}});
addEventListener('unhandledrejection',e=>{try{toast('Ошибка: '+((e.reason&&e.reason.message)||e.reason),true)}catch(_){}});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pctile=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.min(s.length-1,Math.floor(p*s.length))]:0};
const sum=(a,f)=>a.reduce((x,t)=>x+(f?f(t):t),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=(v,o={})=>{if(v==null||!isFinite(v))return'—';const d=o.dec??2;const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return(v<0?'−':(o.sign&&v>0?'+':''))+'$'+s};
const fmtUsd0=(v,o={})=>fmtUsd(v,{...o,dec:0});
const fmtDD=v=>{const a=Math.abs(v);if(!(a>=.05))return'0%';if(a<.1)return'<0.1%';return(v<0?'−':'')+a.toFixed(1)+'%'};
const pn=(n,a,b,c)=>{const m=n%100,d=n%10;return m>10&&m<20?c:d===1?a:d>1&&d<5?b:c};
const one=n=>n%10===1&&n%100!==11;
const nTr=n=>`${n} ${pn(n,'сделка','сделки','сделок')}`;
const nTrG=n=>`${n} ${one(n)?'сделки':'сделок'}`;
const nTrP=n=>`${n} ${one(n)?'сделке':'сделках'}`;
const nTrD=n=>`${n} ${one(n)?'сделке':'сделкам'}`;
const fmtPF=v=>v==null?'—':(isFinite(v)?v.toFixed(2):'∞');
const fmtR=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2)+' R';
const fmtPx=v=>v==null?'—':(v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:1}):v.toFixed(v>=10?2:4));
const SESS=[{id:'asia',label:'Азия'},{id:'eu',label:'Европа'},{id:'us',label:'США'}];
const sessIdx=h=>h<8?0:h<16?1:2;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* демо-журнал: стабильный (seed), с закономерностями, которые анализатор должен найти */
function genDemo(seed,N=180){
  const rnd=rng(seed);
  const toks=[['SOLUSDT',150,.30,.52],['BTCUSDT',68000,.25,.54],['ETHUSDT',3400,.22,.52],['AVAXUSDT',38,.12,.47],['NEARUSDT',6.2,.11,.44]];
  const SW=[.26,.44,.42], RISK=40, out=[], end=Math.floor(Date.now()/864e5)*864e5, span=60*864e5;
  let ts=end-span*.78;
  for(let i=0;i<N;i++){
    ts+=span/N*(.25+rnd()*1);
    let u=rnd(),tk=toks[0];for(const x of toks){if(u<x[2]){tk=x;break}u-=x[2]}
    const d=new Date(ts),sess=sessIdx(d.getUTCHours());
    const dir=rnd()<.56?'long':'short', order=rnd()<.62?'market':'limit';
    const win=rnd()<clamp(SW[sess]+(tk[3]-.52)*.6,.15,.8);
    let reason,r;
    if(win){reason=rnd()<.68?'take_profit':'trailing_stop';r=reason==='take_profit'?1.2+rnd()*1.8:.5+rnd()*1.3}
    else{const q=rnd();reason=q<.66?'stop_loss':q<.86?'trailing_stop':'time_stop';r=reason==='stop_loss'?-(.75+rnd()*.3):reason==='trailing_stop'?-(.2+rnd()*.5):-(.1+rnd()*.5)}
    const gross=+(r*RISK).toFixed(2);
    const fees=order==='market'?1.6:.9;
    const slip=order==='market'?(rnd()<.5?+(.8+rnd()*3.6).toFixed(2):.25):.08;
    const mfe=win?r+rnd()*(reason==='trailing_stop'?1:.25):rnd()*(reason==='time_stop'?1:.6);
    const mae=win?rnd()*.7:Math.abs(r)+rnd()*.12;
    const dec=tk[1]>1000?1:tk[1]>20?2:4, entry=tk[1]*(1+(rnd()-.5)*.06);
    const exit=entry*(1+(dir==='long'?1:-1)*r*.005);
    out.push({id:'T-'+String(i+1).padStart(3,'0'),token:tk[0],direction:dir,entry_date:d.toISOString(),entry_price:+entry.toFixed(dec),exit_price:+exit.toFixed(dec),
      pnl_usdt:+(gross-fees-slip).toFixed(2),gross_pnl:gross,r_multiple:+r.toFixed(2),exchange_fees_usdt:fees,slippage_cost_usdt:slip,
      mae:+mae.toFixed(2),mfe:+mfe.toFixed(2),exit_reason:reason,order_type:order});
  }
  return out;
}

/* ---------- импорт: числа, даты, CSV, отчёт ---------- */
const CURRENCY=/[$€£₽₮¥]|usdt|usdc|usd|rub|руб|eur/gi;
function parseNum(v){
  if(typeof v==='number')return Number.isFinite(v)?{v,conv:0,comma:0,amb:0}:null;
  if(typeof v!=='string')return null;
  let s=v.replace(/[\s\u00a0\u202f\u2009]/g,'').replace(/[−–—]/g,'-').replace(CURRENCY,'').replace(/%$/,'');
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(!/^[+-]?[\d.,]+(e[+-]?\d+)?$/i.test(s))return null;
  let comma=0,amb=0;const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){if(lc>ld){s=s.replace(/\./g,'').replace(',','.');comma=1}else s=s.replace(/,/g,'')}
  else if(lc>=0){
    const parts=s.split(',');
    if(parts.length>2)s=s.replace(/,/g,'');
    else{if(parts[1].length===3&&/^\d{1,3}$/.test(parts[0].replace(/^[+-]/,'')))amb=1;s=s.replace(',','.');comma=1}
  }else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const x=parseFloat(s);if(!Number.isFinite(x))return null;
  return{v:neg?-x:x,conv:1,comma,amb};
}
function parseDate(v){
  if(v===undefined||v===null||v==='')return undefined;
  if(typeof v==='number')return Number.isFinite(v)&&v>0?(v<1e11?v*1000:v):null;
  const s=String(v).trim();let m;
  if(/^\d{9,13}$/.test(s)){const n=+s;return n<1e11?n*1000:n}
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2})(?:[.,]\d+)?)?)?\s*(Z|[+-]\d{2}:?\d{2})?$/i)){
    const[,Y,M,D,hh,mi,se,tz]=m;let ms=Date.UTC(+Y,+M-1,+D,+(hh||0),+(mi||0),+(se||0));const vd=new Date(ms);if(vd.getUTCMonth()!==+M-1||vd.getUTCDate()!==+D)return null;
    if(tz&&tz.toUpperCase()!=='Z'){const sg=tz[0]==='-'?-1:1,t=tz.replace(/\D/g,'');ms-=sg*(+t.slice(0,2)*60+ +t.slice(2,4))*60000}
    return Number.isFinite(ms)?ms:null;
  }
  if(m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/)){
    let[,D,M,Y,hh,mi,se]=m;Y=+Y<100?2000+ +Y:+Y;D=+D;M=+M;if(M>12&&D<=12)[D,M]=[M,D];
    if(M<1||M>12||D<1||D>31)return null;
    const ms2=Date.UTC(Y,M-1,D,+(hh||0),+(mi||0),+(se||0)),vd2=new Date(ms2);if(vd2.getUTCMonth()!==M-1||vd2.getUTCDate()!==D)return null;
    return ms2;
  }
  const d=Date.parse(s);return Number.isFinite(d)?d:null;
}
function findArray(p,depth=0){
  if(Array.isArray(p))return{arr:p};
  if(p&&typeof p==='object'&&depth<3){
    for(const k of['trades','data','journal','results','result','items','records','rows','history']){if(p[k]!==undefined){const r=findArray(p[k],depth+1);if(r)return r}}
    for(const v of Object.values(p)){if(Array.isArray(v)&&v.length&&v[0]&&typeof v[0]==='object')return{arr:v}}
  }
  return null;
}
const _nk=new Map();
const normKey=s=>{let v=_nk.get(s);if(v===undefined){v=String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_+|_+$/g,'');_nk.set(s,v)}return v};
const CAP_KEYS=['initial_capital','starting_balance','start_balance','account_balance','capital','deposit','initial_balance'];
function findCapital(o){
  if(!o||typeof o!=='object')return null;
  const r={};for(const k in o)r[normKey(k)]=o[k];
  for(const k of CAP_KEYS){const p=r[k]!==undefined?parseNum(r[k]):null;if(p&&p.v>0)return p.v}
  return null;
}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=c=>first.split(c).length-1;
  const delim=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0],d=cnt(delim)?delim:',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);
  if(rows.length<2)return[];
  const head=rows[0].map(normKey);
  return rows.slice(1).map(r=>{const o={};head.forEach((k,i)=>{if(k&&r[i]!==undefined&&r[i]!=='')o[k]=r[i]});return o});
}
const parseSide=v=>{if(v==null)return null;const s=String(v).trim();if(/short|sell|шорт|продаж/i.test(s))return'short';if(/long|buy|лонг|покупк/i.test(s))return'long';if(/^s$/i.test(s))return'short';if(/^[lb]$/i.test(s))return'long';return null};
function normalize(raw){
  const T=[],rep={total:raw.length,ok:0,skipped:0,converted:0,comma:0,amb:0,badDate:0,noDate:0,exNum:null,exDate:null,capital:null,
    dupIds:0,exDup:null,future:0,unordered:0,mismatch:0,exMis:null,badSide:0,noSide:0};
  const seen=new Set();let prevTs=null;const now=Date.now();
  raw.forEach((r0,i)=>{
    if(!r0||typeof r0!=='object'||Array.isArray(r0)){rep.skipped++;return}
    const r={};for(const k in r0)r[normKey(k)]=r0[k];
    const pick=(...k)=>{for(const x of k){const v=r[x];if(v!==undefined&&v!==null&&v!=='')return[x,v]}return[null,undefined]};
    const num=(f,...k)=>{const[key,v]=pick(...k);if(v===undefined)return null;const p=parseNum(v);
      if(!p){if(!rep.exNum)rep.exNum=`${key}: «${String(v).slice(0,18)}»`;return null}
      if(typeof v==='string'){rep.converted+=p.conv;rep.comma+=p.comma;rep.amb+=p.amb}return p.v};
    const fees=num('fees','exchange_fees_usdt','fees_usdt','fees','fee','commission','комиссия')??0;
    const slip=num('slip','slippage_cost_usdt','slippage_usdt','slippage','slip','проскальзывание')??0;
    const netRaw=num('net','pnl_usdt','net_pnl','pnl','profit','net_profit','realized_pnl','pnl_usd','profit_usdt','result','прибыль'),grossRaw=num('gross','gross_pnl','gross_profit','gross');
    let net=netRaw,gross=grossRaw;
    if(net==null&&gross==null){rep.skipped++;return}
    if(net==null)net=gross-fees-slip;
    if(gross==null)gross=net+fees+slip;

function finalize(T){

  const losers=T.filter(t=>t.net<0);
  const avgLoss=losers.length?sum(losers,t=>Math.abs(t.net))/losers.length:1;
  const withR=T.filter(t=>t.r!=null&&Math.abs(t.r)>.1&&t.gross!==0);
  let riskR=withR.length?median(withR.map(t=>Math.abs(t.gross/t.r))):avgLoss;

  T.forEach(t=>{if(t.r==null)t.r=t.gross/riskR;t.sess=flags.hasDates?sessIdx(new Date(t.ts).getUTCHours()):null});

function stats(tr,base){
  const n=tr.length,o={n,net:0,gross:0,fees:0,slip:0,wins:0,winsSum:0,lossSum:0,sumR:0,eq:[],dd:[],maxDD:0,maxLossStreak:0,base,ruin:false};

    if(t.net>0){o.wins++;o.winsSum+=t.net;streak=0}else{o.lossSum-=t.net;if(++streak>o.maxLossStreak)o.maxLossStreak=streak}

function bootCI(tr){

  for(let i=0;i<n;i++){nets[i]=tr[i].net;rs[i]=tr[i].r;if(nets[i]>0)wins++}
  for(let b=0;b<B;b++){let ws=0,ls=0,sr=0;for(let i=0;i<n;i++){const k=(rnd()*n)|0,v=nets[k];if(v>0)ws+=v;else ls-=v;sr+=rs[k]}pf.push(ls>0?ws/ls:Infinity);ex.push(sr/n)}

  const gv=[...groups.values()];

      cause:ok?`Сегмент «${x.k}» в сумме убыточен, и разница с остальными сделками статистически значима. Стратегия, похоже, не подходит условиям этого сегмента.`:`Сегмент «${x.k}» в сумме убыточен, но при проверке стольких сегментов такая разница встречается и случайно. Считайте это гипотезой, а не выводом.`,
      evidence:[`Net PnL сегмента ${fmtUsd(x.s.net,{sign:1,dec:0})} на ${nTrP(x.g.length)}`,
        `Средний Net на сделку: ${fmtUsd(m,{sign:1})} в сегменте против ${fmtUsd(avg(x.rest.map(t=>t.net)),{sign:1})} у остальных, разница ${fmtUsd(x.tst.diff,{sign:1})} (95% интервал ${fmtUsd(x.tst.lo,{sign:1})} … ${fmtUsd(x.tst.hi,{sign:1})})`,
        `Profit Factor ${fmtPF(x.s.pf)}, win rate ${x.s.winRate.toFixed(0)}%, ожидание ${fmtR(x.s.exp)}; у остальных PF ${fmtPF(x.rs.pf)}`],
      freq:`${x.g.length} из ${nTrG(n)} (${heavyPct(x.g.length,n)}%)`,potential:gain,
      effect:`Если исключить сегмент и его средний результат сохранится, Net изменится на ${fmtUsd0(gain,{sign:1})} (95% интервал от ${fmtUsd0(gLo,{sign:1})} до ${fmtUsd0(gHi,{sign:1})}).${ok?'':' Нижняя граница интервала показывает, что выигрыш может оказаться нулевым или отрицательным.'}`,fix:x.fix});
  });
  const rank={ok:0,obs:1,unconfirmed:2};
  out.sort((a,b)=>(rank[a.status]-rank[b.status])||(b.damage-a.damage));
  out.forEach(b=>{b.share=b.damage/base*100;b.conf=conf(b.n);
    b.prio=b.status==='unconfirmed'?['Низкий','low']:b.share>=12?['Высокий','down']:b.share>=6?['Средний','warn']:['Низкий','low']});
  return out;
}

function loadTrades(raw,source,name,opts={}){

  S.flags=finalize(T);S.all=T;S.source=source;S.fileName=name||'';S.raw=source==='file'?raw:null;S.rep=source==='file'?rep:null;

  S.tokens=new Set();S.period='all';S.dir='all';S.jr.page=0;

function recompute(){
  let tr=S.all;
  if(S.dir!=='all')tr=tr.filter(t=>t.dir===S.dir);
  if(S.tokens.size)tr=tr.filter(t=>S.tokens.has(t.token));
  let base=S.capital,prev=null,pbase=S.capital;
  if(S.period!=='all'&&S.flags.hasDates&&tr.length){
    const end=Math.max(...tr.map(t=>t.ts)),ms=+S.period*864e5;
    const cur=tr.filter(t=>t.ts>end-ms);
    prev=tr.filter(t=>t.ts<=end-ms&&t.ts>end-2*ms);
    base=S.capital+sum(tr.filter(t=>t.ts<=end-ms),t=>t.net);
    pbase=S.capital+sum(tr.filter(t=>t.ts<=end-2*ms),t=>t.net);
    tr=cur;
  }
  S.view=tr;S.prev=prev&&prev.length>=5?prev:null;
  S.st=stats(tr,base);S.st.ci=bootCI(tr);S.st.mc=mcDD(tr,base);S.pst=S.prev?stats(S.prev,pbase):null;
  S.health=tr.length?health(S.st,tr,S.flags.hasDates):null;
  S.bn=tr.length?findBottlenecks(tr,S.st,S.flags):[];
  S.sp={};
  if(tr.length>=4){
    S.sp.net=S.st.eq.filter((_,i)=>i%Math.max(1,Math.floor(tr.length/22))===0);
    Object.assign(S.sp,trailAll(tr,base));
  }
  S.jr.page=0;
  TABS.forEach(t=>dirty.add(t[0]));
  renderChrome();renderTab();
}

/* ---------- Анатомия убытков ---------- */
const lumRGB=(r,g,b)=>{const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
function heatCell(v,mx){
  const pos=v>=0,a=.12+Math.abs(v)/mx*.7,base=[11,18,32],fg=(pos?P.upRgb:P.downRgb).split(',').map(Number);
  const bg=fg.map((c,i)=>Math.round(c*a+base[i]*(1-a))),L=lumRGB(...bg),cw=1.05/(L+.05),cd=(L+.05)/(lumRGB(6,16,11)+.05);
  const stripes=pos?'':'repeating-linear-gradient(135deg,rgba(0,0,0,.22) 0 4px,transparent 4px 8px),';
  return`background:${stripes}rgba(${fg.join(',')},${a.toFixed(2)});color:${cw>=cd?'#fff':'#06100b'}`;
}
function renderLosses(){
  const tr=S.view,F=S.flags,el=$('#view-losses');
  const losers=tr.filter(t=>t.net<0),byReason=F.hasReason;
  const lg=[...groupBy(losers,t=>(byReason?t.reason:t.token)||'без причины')].map(([k,g])=>[k,-sum(g,t=>t.net),g.length]).sort((a,b)=>b[1]-a[1]);
  const totalLoss=sum(lg,x=>x[1])||1;let acc=0;const cum=lg.map(x=>(acc+=x[1])/totalLoss*100),line=lg.length>4;
  const lo=-2,hi=4,step=.5,bins=[],lab=[];
  for(let x=lo;x<hi;x+=step){bins.push(0);lab.push(x.toFixed(1).replace('-','−'))}
  tr.forEach(t=>{const i=clamp(Math.floor((t.r-lo)/step),0,bins.length-1);bins[i]++});
  let heat='';
  if(F.hasDates){
    const cells=Array.from({length:7},()=>Array(6).fill(0)),cnt=Array.from({length:7},()=>Array(6).fill(0));
    tr.forEach(t=>{const d=new Date(t.ts),r=(d.getUTCDay()+6)%7,c=Math.floor(d.getUTCHours()/4);cells[r][c]+=t.net;cnt[r][c]++});
    const mx=Math.max(1,...cells.flat().map(Math.abs)),DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],HB=['0–4','4–8','8–12','12–16','16–20','20–24'];
    heat=`<div class="heat"><span></span>${HB.map(x=>`<span class="h">${x}</span>`).join('')}
      ${DN.map((d,r)=>`<span class="h">${d}</span>`+cells[r].map((v,c)=>{
        if(!cnt[r][c])return`<span class="c" style="background:rgba(255,255,255,.025)" data-tip="${d}, ${HB[c]} UTC: сделок нет"></span>`;
        return`<span class="c" style="${heatCell(v,mx)}" data-tip="${d}, ${HB[c]} UTC: ${fmtUsd(v,{sign:1,dec:0})}, сделок: ${cnt[r][c]}">${v<0?'−':''}${Math.round(Math.abs(v))}</span>`}).join('')).join('')}</div>
      <div class="hlegend"><span>${fmtUsd(-mx,{dec:0})}</span><i></i><span>${fmtUsd(mx,{dec:0,sign:1})}</span></div>
      <div class="note">Часы по UTC, в ячейках Net PnL в долларах. Убыток отмечен знаком «−» и штриховкой, прибыль залита ровным цветом.</div>`;
  }else heat='<div class="empty" style="padding:40px 0">В журнале нет дат входа, карту по времени построить нельзя.</div>';
  const marker=(c,sh)=>`<span style="color:${c}">${sh}</span>`;
  el.innerHTML=`<div class="grid">
    <article class="card hero s7"><div class="card-h"><div><h3>Парето убытков</h3><div class="sub">${losers.length?`Убыточные сделки по ${byReason?'причине выхода':'токену'}${line?', линия показывает накопленную долю':''}`:''}</div></div></div>
      ${losers.length?`<div class="ch-md"><div id="cPareto" class="cv" role="img" aria-label="Парето убытков: ${lg[0]?esc(lg[0][0])+' даёт '+(lg[0][1]/totalLoss*100).toFixed(0)+'% убытков':'убытков нет'}"></div></div>${line?'':`<div class="note">${esc(lg[0][0])} даёт ${(lg[0][1]/totalLoss*100).toFixed(0)}% всех убытков: ${fmtUsd0(lg[0][1])} из ${fmtUsd0(totalLoss)}.</div>`}`:'<div class="empty" style="padding:40px 0">В выборке нет убыточных сделок.</div>'}</article>
    <article class="card s5"><div class="card-h"><div><h3>Распределение результатов</h3><div class="sub">Сколько сделок закрылось в каждом диапазоне ${T('R')}</div></div></div><div class="ch-md"><div id="cHist" class="cv" role="img" aria-label="Гистограмма R"></div></div></article>
    <article class="card s6"><div class="card-h"><div><h3>${T('MFE и MAE')}</h3><div class="sub">Максимум в плюсе и в минусе внутри каждой сделки, в R</div></div></div>
      ${F.hasExc?`<div class="ch-md"><div id="cScatter" class="cv" role="img" aria-label="MFE против MAE"></div></div><div class="legend" style="margin-top:10px">${marker(P.up,'●')} прибыльная сделка ${marker(P.down,'◆')} убыточная сделка</div><div class="note">Убыточная точка в верхней зоне: сделка была в хорошем плюсе, но закрылась хуже, значит, выход запоздал. Точка в нижней правой зоне: вход оказался неточным. Границы зон (1R и 0.8R) условные.</div>`:'<div class="empty" style="padding:40px 0">В журнале нет полей mae и mfe.</div>'}</article>
    <article class="card s6"><div class="card-h"><div><h3>Когда робот теряет деньги</h3><div class="sub">Net PnL по дням недели и времени входа</div></div></div>${heat}</article>
  </div>`;
  if(losers.length)mount('losses:p','cPareto',B.pareto({lg,cum,line}));
  mount('losses:h','cHist',B.hist({bins,lab,lo,step}));
  if(F.hasExc)mount('losses:s','cScatter',B.scatter({pts:tr.filter(t=>t.mae!=null&&t.mfe!=null)}));
}

        <select class="jsel" id="jsel" aria-label="Сортировка">${cur<0?'<option selected disabled>Своя сортировка</option>':''}${SORTS.map((x,i)=>`<option value="${i}"${i===cur?' selected':''}>${x[2]}</option>`).join('')}</select>
      </div>
      <div style="display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap"><span class="mute">Записей: <b id="jc" style="color:var(--text)">0</b> из ${s.n}</span><button class="btn" id="jx" type="button">${ic('download')}<span>Экспорт CSV</span></button></div>
    </div>
    <div class="tbl-wrap tall"><table class="jt"><thead><tr>${COLS.map(([k,l])=>`<th class="${['entry','exit','cost','net','r'].includes(k)?'r':''}" aria-sort="${S.jr.sort===k?(S.jr.asc?'ascending':'descending'):'none'}"><button type="button" data-k="${k}" title="Сортировать по колонке «${l}»">${l}${S.jr.sort===k?(S.jr.asc?' ▲':' ▼'):'<span class="sortg" aria-hidden="true">⇅</span>'}</button></th>`).join('')}</tr></thead><tbody id="jb"></tbody></table></div>
    <div class="jcards" id="jcards"></div>
    <div class="pager"><span id="jp"></span><button type="button" id="jprev" aria-label="Назад">${ic('prev')}</button><button type="button" id="jnext" aria-label="Вперёд">${ic('next')}</button></div>
  </article></div>`;
  $('#jq').addEventListener('input',e=>{S.jr.q=e.target.value;S.jr.page=0;journalBody()});
  $('#jo').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.jr.outcome=b.dataset.v;S.jr.page=0;$$('#jo button').forEach(x=>x.setAttribute('aria-pressed',x===b));journalBody()});
  $('#jsel').addEventListener('change',e=>{const x=SORTS[+e.target.value];if(!x)return;S.jr.sort=x[0];S.jr.asc=x[1];S.jr.page=0;dirty.add('trades');renderTab()});
  $('thead',el).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;if(S.jr.sort===k)S.jr.asc=!S.jr.asc;else{S.jr.sort=k;S.jr.asc=false}dirty.add('trades');renderTab()});
  $('#jprev').addEventListener('click',()=>{S.jr.page--;journalBody()});
  $('#jnext').addEventListener('click',()=>{S.jr.page++;journalBody()});
  $('#jx').addEventListener('click',()=>{
    const rows=journalRows(),hd='id,time_utc,token,direction,entry_price,exit_price,exit_reason,order_type,fees_usdt,slippage_usdt,gross_pnl,net_pnl,r_multiple';
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',qt=v=>q(/^[=+\-@\t\r]/.test(String(v??''))?"'"+v:v);
    download('journal_filtered.csv',hd+'\n'+rows.map(t=>[t.id,t.ts?new Date(t.ts).toISOString():'',t.token,t.dir,t.entry,t.exit,t.reason,t.order,t.fees,t.slip,t.gross.toFixed(2),t.net.toFixed(2),t.r.toFixed(2)].map((v,i)=>[0,2,6,7].includes(i)?qt(v):q(v)).join(',')).join('\n'),'text/csv');
  });
  journalBody();
}
function journalBody(){
  const rows=journalRows(),PER=25,pages=Math.max(1,Math.ceil(rows.length/PER));
  S.jr.page=clamp(S.jr.page,0,pages-1);
  const part=rows.slice(S.jr.page*PER,S.jr.page*PER+PER);
  $('#jb').innerHTML=part.length?part.map(t=>`<tr><td class="dim">${esc(t.id)}</td><td class="mute">${dFull(t.ts)}</td><td><b style="font-weight:600">${esc(t.token)}</b></td><td class="${t.dir==='long'?'up':'down'}" style="font-weight:600">${t.dir==='long'?'Long':'Short'}</td>
    <td class="r">${fmtPx(t.entry)}</td><td class="r">${fmtPx(t.exit)}</td><td class="mute">${esc(t.reason||'—')}</td><td class="r mute">${fmtUsd(t.fees+t.slip)}</td>
    <td class="r ${t.net>=0?'up':'down'}" style="font-weight:600">${fmtUsd(t.net,{sign:1})}</td><td class="r ${t.net>=0?'up':'down'}">${fmtR(t.r)}</td></tr>`).join(''):`<tr><td colspan="10"><div class="empty" style="padding:36px 0">Ничего не найдено</div></td></tr>`;
  $('#jcards').innerHTML=part.length?part.map(t=>`<div class="jc"><div class="a">${esc(t.token)} <span class="${t.dir==='long'?'up':'down'}" style="font-size:12px">${t.dir==='long'?'Long':'Short'}</span></div><div class="p ${t.net>=0?'up':'down'}">${fmtUsd(t.net,{sign:1})}</div><div class="b">${esc(t.id)}, ${dFull(t.ts)}</div><div class="q ${t.net>=0?'up':'down'}">${fmtR(t.r)}</div><div class="c">${esc(t.reason||'—')}, издержки ${fmtUsd(t.fees+t.slip)}</div></div>`).join(''):`<div class="empty" style="padding:36px 0">Ничего не найдено</div>`;
  $('#jc').textContent=rows.length;
  $('#jp').textContent=`Страница ${S.jr.page+1} из ${pages}`;
  $('#jprev').disabled=S.jr.page===0;$('#jnext').disabled=S.jr.page>=pages-1;
}

/* ---------- запуск ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  const pr=storeGet(PREF_KEY);
  if(pr){if(pr.capital>0)S.capital=pr.capital;if(pr.cvd){document.body.classList.add('cvd');P=PAL_CVD}}
  buildChrome();
  const hh=readHash();if(hh.tab)S.tab=hh.tab;
  const sv=storeGet(STORE_KEY);let ok=false;
  if(sv&&Array.isArray(sv.raw)&&sv.raw.length){try{loadTrades(sv.raw,'file',sv.name,{restored:sv.at,noSave:true});ok=true}catch(e){storeDel(STORE_KEY)}}
  if(!ok)loadTrades(genDemo(S.seed),'demo');
  applyHash(hh);
  switchTab(S.tab,'none');writeHash(false);
});
</script>
</body>
</html>
