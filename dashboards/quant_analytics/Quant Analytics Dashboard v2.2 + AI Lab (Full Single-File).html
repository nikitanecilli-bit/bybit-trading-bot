<script>
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pctile=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.min(s.length-1,Math.floor(p*s.length))]:0};
const sum=(a,f)=>a.reduce((x,t)=>x+(f?f(t):t),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=(v,o={})=>{if(v==null||!isFinite(v))return'—';const d=o.dec??2;const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return(v<0?'−':(o.sign&&v>0?'+':''))+'$'+s};
const fmtUsd0=(v,o={})=>fmtUsd(v,{...o,dec:0});
const fmtPF=v=>v==null?'—':(isFinite(v)?v.toFixed(2):'∞');
const fmtR=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2)+' R';
const SESS=[{id:'asia',label:'Азия'},{id:'eu',label:'Европа'},{id:'us',label:'США'}];
const sessIdx=h=>h<8?0:h<16?1:2;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

function toast(msg){const t=$('#toast');t.textContent=msg;t.className='toast show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2800)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function genDemo(seed,N=180){
  const rnd=rng(seed);
  const toks=[['DOGEUSDT',0.15,.28,.56],['SOLUSDT',155,.26,.54],['XRPUSDT',0.58,.22,.53],['ETHUSDT',3400,.14,.50],['PEPEUSDT',0.012,.10,.34]];
  const SW=[.28,.52,.50], RISK=100, out=[], end=Math.floor(Date.now()/864e5)*864e5, span=60*864e5;
  let ts=end-span*.8;
  for(let i=0;i<N;i++){
    ts+=span/N*(.3+rnd()*1);
    let u=rnd(),tk=toks[0];for(const x of toks){if(u<x[2]){tk=x;break}u-=x[2]}
    const d=new Date(ts),sess=sessIdx(d.getUTCHours());
    const dir=rnd()<.55?'long':'short', order=rnd()<.58?'market':'limit';
    const win=rnd()<clamp(SW[sess]+(tk[3]-.50)*.8,.15,.82);
    let reason,r;
    if(win){reason=rnd()<.68?'take_profit':'trailing_stop';r=reason==='take_profit'?1.4+rnd()*1.9:.6+rnd()*1.4}
    else{const q=rnd();reason=q<.66?'stop_loss':q<.86?'trailing_stop':'time_stop';r=reason==='stop_loss'?-(.8+rnd()*.25):-(.25+rnd()*.45)}
    const gross=+(r*RISK).toFixed(2);
    const fees=order==='market'?4.2:1.6;
    const slip=order==='market'?(rnd()<.5?+(2.5+rnd()*5.5).toFixed(2):1.2):.15;
    const mfe=win?r+rnd()*.8:rnd()*(reason==='time_stop'?1.1:.65);
    const mae=win?rnd()*.68:Math.abs(r)+rnd()*.18;
    out.push({id:'T-'+String(i+1).padStart(3,'0'),token:tk[0],direction:dir,entry_date:d.toISOString(),entry_price:tk[1],exit_price:+(tk[1]*(1+r*0.01)).toFixed(4),
      pnl_usdt:+(gross-fees-slip).toFixed(2),gross_pnl:gross,r_multiple:+r.toFixed(2),exchange_fees_usdt:fees,slippage_cost_usdt:slip,
      mae:+mae.toFixed(2),mfe:+mfe.toFixed(2),exit_reason:reason,order_type:order});
  }
  return out;
}

function parseCSV(text){
  const lines=text.replace(/^\ufeff/,'').trim().split(/\r?\n/);
  if(lines.length<2)return[];
  const delim=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const head=lines[0].split(delim).map(s=>s.trim().toLowerCase());
  return lines.slice(1).map(l=>{const p=l.split(delim),o={};head.forEach((k,i)=>o[k]=p[i]);return o});
}

function normalize(raw){
  const T=[];
  raw.forEach((r,i)=>{
    if(!r||typeof r!=='object')return;
    const num=k=>{const v=r[k];if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isFinite(n)?n:null};
    const fees=Math.abs(num('exchange_fees_usdt')??num('fees')??num('total_costs')??0);
    const slip=Math.abs(num('slippage_cost_usdt')??num('slippage')??0);
    let net=num('pnl_usdt')??num('net_pnl')??num('pnl'), gross=num('gross_pnl')??num('gross');
    if(net==null&&gross==null)return;
    if(net==null)net=gross-fees-slip;
    if(gross==null)gross=net+fees+slip;
    const dt=r.entry_date||r.first_trade||null;
    const ts=dt?Date.parse(dt):null;
    T.push({
      id:String(r.id||'T-'+(i+1)), token:String(r.token||r.symbol||'ASSET'),
      dir:/short|sell/i.test(String(r.direction||''))?'short':'long',
      ts:isFinite(ts)?ts:null, entry:num('entry_price')??100, exit:num('exit_price')??100,
      net, gross, fees, slip, r:num('r_multiple')??num('expectancy_r')??(gross/100),
      mae:num('mae')??0.5, mfe:num('mfe')??0.8,
      reason:String(r.exit_reason||'trade'), order:String(r.order_type||'market').toLowerCase(),
      sess:isFinite(ts)?sessIdx(new Date(ts).getUTCHours()):1
    });
  });
  return T;
}

function stats(tr,base){
  const n=tr.length,o={n,net:0,gross:0,fees:0,slip:0,wins:0,winsSum:0,lossSum:0,sumR:0,eq:[],dd:[],maxDD:0,base};
  let eq=base,peak=base;
  for(const t of tr){
    o.net+=t.net;o.gross+=t.gross;o.fees+=t.fees;o.slip+=t.slip;o.sumR+=t.r;
    if(t.net>0){o.wins++;o.winsSum+=t.net}else{o.lossSum-=t.net}
    eq+=t.net;if(eq>peak)peak=eq;const d=peak>0?(eq-peak)/peak*100:0;o.eq.push(eq);o.dd.push(d);if(d<o.maxDD)o.maxDD=d;
  }
  o.winRate=n?o.wins/n*100:0;
  o.pf=o.lossSum>0?o.winsSum/o.lossSum:(o.winsSum>0?9.99:0);
  o.exp=n?o.sumR/n:0;
  o.costs=o.fees+o.slip;
  o.costDrag=o.gross>0?o.costs/o.gross*100:null;
  const losers=tr.filter(t=>t.net<0);
  o.riskR=losers.length?sum(losers,t=>Math.abs(t.net))/losers.length:100;
  return o;
}

function groupBy(tr,fn){const m=new Map();for(const t of tr){const k=fn(t);if(k==null)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(t)}return m}

/* Математическое ядро Лаборатории ИИ (PRIM, Выживаемость Каплана-Мейера, DSR) */
function normCdf(x){
  const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;
}
function computeDSR(tr, trials=24){
  const n=tr.length; if(n<8) return {sr:'0.00', dsr:'0.0', skew:'0.00', kurt:'3.00'};
  const rs=tr.map(t=>t.r||0), mu=rs.reduce((a,b)=>a+b,0)/n;
  const vr=rs.reduce((a,x)=>a+(x-mu)*(x-mu),0)/Math.max(1,n-1), sd=Math.sqrt(Math.max(1e-9,vr));
  const sr=mu/sd;
  const skew=rs.reduce((a,x)=>a+Math.pow((x-mu)/sd,3),0)/n;
  const kurt=rs.reduce((a,x)=>a+Math.pow((x-mu)/sd,4),0)/n;
  const z1=Math.sqrt(2*Math.log(Math.max(2,trials))), sr0=sd*((1-0.5772)*z1+0.5772*Math.sqrt(2*Math.log(trials*Math.E)))/Math.sqrt(n);
  const den=Math.sqrt(Math.max(1e-9, 1 - skew*sr + ((kurt-1)/4)*sr*sr));
  const dsr=normCdf(((sr-sr0)*Math.sqrt(n-1))/den)*100;
  return {sr:sr.toFixed(3), dsr:dsr.toFixed(1), skew:skew.toFixed(2), kurt:kurt.toFixed(2)};
}
function optimizeSurvival(tr, riskR){
  const v=tr.filter(t=>t.mae!=null&&t.mfe!=null);
  let bestS=0.80, bestGain=0;
  for(let s=0.45; s<=1.05; s+=0.05){
    let gain=0;
    for(const t of v){ if(t.mae>s){ gain += (-s*riskR - (t.fees+t.slip) - t.net); } }
    if(gain>bestGain){ bestGain=gain; bestS=+s.toFixed(2); }
  }
  let bestBe=0.95, beGain=0;
  for(let m=0.75; m<=1.45; m+=0.10){
    let g=0;
    for(const t of v){ if(t.net<0 && t.mfe>=m) g += Math.abs(t.net); }
    if(g>beGain){ beGain=g; bestBe=+m.toFixed(2); }
  }
  return {optStop:bestS, stopGain:Math.round(bestGain), optBe:bestBe, beGain:Math.round(beGain)};
}
function mineSubgroups(tr, riskR){
  const n=tr.length, mid=n>>1, minN=Math.max(4, Math.round(n*0.04));
  const map=new Map();
  tr.forEach((t,idx)=>{
    const crr=(t.fees+t.slip)/Math.max(1,riskR);
    const tags=[
      `Токен: ${t.token}`,
      `Сторона: ${t.dir==='long'?'Long':'Short'}`,
      t.sess!=null?`Сессия: ${SESS[t.sess].label}`:null,
      `Ордер: ${t.order}`,
      crr>0.08?'Трение CRR > 8%':'Трение CRR ≤ 8%'
    ].filter(Boolean);
    for(let i=0;i<tags.length;i++){
      add(tags[i], idx, t.net);
      for(let j=i+1;j<tags.length;j++) add(`${tags[i]} + ${tags[j]}`, idx, t.net);
    }
  });
  function add(k,idx,v){ if(!map.has(k)) map.set(k,[]); map.get(k).push([idx,v]); }
  const toxic=[], golden=[];
  for(const [rule, arr] of map){
    if(arr.length<minN || arr.length>n*0.85) continue;
    const h1=arr.filter(x=>x[0]<mid).map(x=>x[1]), h2=arr.filter(x=>x[0]>=mid).map(x=>x[1]);
    if(h1.length<2 || h2.length<2) continue;
    const s1=h1.reduce((a,b)=>a+b,0), s2=h2.reduce((a,b)=>a+b,0), tot=s1+s2;
    const wins=arr.filter(x=>x[1]>0).length;
    const item={rule, n:arr.length, tot:Math.round(tot), wr:Math.round(wins/arr.length*100)};
    if(s1<0 && s2<0 && tot<0) toxic.push(item);
    else if(s1>0 && s2>0 && tot>0) golden.push(item);
  }
  toxic.sort((a,b)=>a.tot-b.tot); golden.sort((a,b)=>b.tot-a.tot);
  return {toxic:toxic.slice(0,5), golden:golden.slice(0,5)};
}

const S={all:[],view:[],tab:'overview',period:'all',dir:'all',tokens:new Set(),capital:10000,source:'demo',seed:11,fileName:'',st:null};
const TABS=[
  ['overview','Обзор','<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>'],
  ['ailab','ИИ-Лаб','<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'],
  ['pnl','PnL','<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>'],
  ['losses','Убытки','<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>'],
  ['trades','Журнал','<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/>']
];

function drawLineSvg(hostId, eq1, eq2, col2='#34d399'){
  const host=document.getElementById(hostId); if(!host||!eq1.length)return;
  const w=host.clientWidth||640, h=host.clientHeight||260, l=64, r=16, t=14, b=24, iw=w-l-r, ih=h-t-b;
  const all=[...eq1,...(eq2||[])], mn=Math.min(...all)*0.99, mx=Math.max(...all)*1.01, span=(mx-mn)||1;
  const X=i=>l+(eq1.length>1?i/(eq1.length-1)*iw:iw/2), Y=v=>t+(mx-v)/span*ih;
  const p1=eq1.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const p2=(eq2&&eq2.length)?eq2.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' '):'';
  let grid='';
  for(let k=0;k<=4;k++){
    const v=mx-span*(k/4), y=Y(v).toFixed(1);
    grid+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="rgba(148,197,255,.08)"/><text x="${l-8}" y="${+y+4}" text-anchor="end" fill="#8d9db7" font-size="11">${fmtUsd0(v)}</text>`;
  }
  host.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${grid}
    ${p2?`<path d="${p2}" fill="none" stroke="${col2}" stroke-width="2.2" stroke-dasharray="5 4"/>`:''}
    <path d="${p1}" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  </svg>`;
}

function renderOverview(){
  const s=S.st, tr=S.view, el=$('#view-overview');
  const endEq=s.eq[s.eq.length-1]||s.base, chg=(endEq-s.base)/s.base*100;
  let g=s.base; const grossEq=tr.map(t=>g+=t.gross);
  el.innerHTML=`<div class="grid">
    <article class="card kpi s2"><span class="lbl">Net PnL</span><div class="kpi-val ${s.net>=0?'up':'down'}">${fmtUsd0(s.net,{sign:1})}</div><div class="kpi-sub">${tr.length} сделок</div></article>
    <article class="card kpi s2"><span class="lbl">Profit Factor</span><div class="kpi-val">${fmtPF(s.pf)}</div><div class="kpi-sub">Gross: ${fmtUsd0(s.gross,{sign:1})}</div></article>
    <article class="card kpi s2"><span class="lbl">Expectancy</span><div class="kpi-val ${s.exp>=0?'up':'down'}">${fmtR(s.exp)}</div><div class="kpi-sub">1R ≈ ${fmtUsd0(s.riskR)}</div></article>
    <article class="card kpi s2"><span class="lbl">Макс. просадка</span><div class="kpi-val down">${s.maxDD.toFixed(1)}%</div><div class="kpi-sub">От пика эквити</div></article>
    <article class="card kpi s2"><span class="lbl">Win Rate</span><div class="kpi-val">${s.winRate.toFixed(1)}%</div><div class="kpi-sub">Побед: ${s.wins}</div></article>
    <article class="card kpi s2"><span class="lbl">Издержки биржи</span><div class="kpi-val warn">${fmtUsd0(s.costs)}</div><div class="kpi-sub">${s.costDrag?s.costDrag.toFixed(1)+'% от Gross':'—'}</div></article>
    <article class="card hero s8">
      <div class="card-h"><div><h3>Кривая капитала (Голубая — Net, Пунктир — Gross до комиссий)</h3><div class="big">${fmtUsd0(endEq)} <span class="${chg>=0?'up':'down'}" style="font-size:15px">${chg>=0?'+':'−'}${Math.abs(chg).toFixed(2)}%</span></div></div>
      <button class="btn primary" type="button" id="goAiLab">🔬 Открыть ИИ-Лабораторию Паттернов</button></div>
      <div class="ch-main"><div id="cEq" class="cv"></div></div>
    </article>
    <article class="card s4">
      <div class="card-h"><div><h3>Быстрая диагностика</h3><div class="sub">Автоматический аудит выборки</div></div></div>
      <div style="display:grid;gap:10px">
        <div class="tile"><div class="lbl">Налог трения (CRR на 1R)</div><div class="val ${(s.costs/(tr.length*s.riskR)*100)<=6?'up':'down'}">${(s.costs/Math.max(1,tr.length*s.riskR)*100).toFixed(1)}%</div><div class="lbl">Инвариант Тождества №1: должно быть ≤ 6%</div></div>
        <div class="tile"><div class="lbl">Потенциал перевода в Maker Limit</div><div class="val up">+${fmtUsd0(s.slip*0.85+s.fees*0.55)}</div><div class="lbl">Экономия на спреде и комиссии 0.02%</div></div>
      </div>
    </article>
  </div>`;
  $('#goAiLab').onclick=()=>switchTab('ailab');
  drawLineSvg('cEq', s.eq, grossEq, '#94a3b8');
}

function renderAiLab(){
  const tr=S.view, s=S.st, riskR=s.riskR||100, el=$('#view-ailab');
  const dsr=computeDSR(tr), surv=optimizeSurvival(tr, riskR), sg=mineSubgroups(tr, riskR);
  const avgCrr = tr.length ? (s.costs / (tr.length * riskR) * 100) : 0;
  const makerSave = Math.round(s.slip * 0.85 + s.fees * 0.55);
  const worstTok = sg.toxic.find(x=>x.rule.startsWith('Токен:'));

  // Контрфактическая кривая What-If (Maker Limit + Optimal Stop + отсечение худшего токсичного кластера)
  let cfEqVal = s.base;
  const cfEq = tr.map(t=>{
    let net = t.net + (t.order==='market' ? (t.slip*0.85 + t.fees*0.55) : 0);
    if(t.mae > surv.optStop) net = Math.max(net, -surv.optStop*riskR - t.fees*0.4);
    if(worstTok && `Токен: ${t.token}` === worstTok.rule) net = 0;
    cfEqVal += net;
    return cfEqVal;
  });
  const cfGain = Math.round(cfEqVal - (s.eq[s.eq.length-1]||s.base));

  el.innerHTML=`<div class="grid">
    <div class="s12"><div class="tiles">
      <div class="tile"><div class="lbl">Дефлированный Шарп (DSR)</div><div class="val ${+dsr.dsr>=80?'up':+dsr.dsr>=50?'warn':'down'}">${dsr.dsr}%</div><div class="lbl">SR=${dsr.sr} | Асимметрия=${dsr.skew} | Эксцесс=${dsr.kurt}</div></div>
      <div class="tile"><div class="lbl">Налог трения (CRR = Costs / Risk)</div><div class="val ${avgCrr<=6?'up':avgCrr<=15?'warn':'down'}">${avgCrr.toFixed(1)}%</div><div class="lbl">Мин. безопасный стоп: ≥ 1.80% цены</div></div>
      <div class="tile"><div class="lbl">Оптимальный Стоп (Каплан — Мейер)</div><div class="val up">−${surv.optStop} R</div><div class="lbl">Экономия на хвостах MAE: ${fmtUsd0(surv.stopGain,{sign:1})}</div></div>
      <div class="tile"><div class="lbl">Эффект What-If Оптимизации</div><div class="val up">${fmtUsd0(cfGain,{sign:1})}</div><div class="lbl">Новое ожидание эквити: ${fmtUsd0(cfEqVal)}</div></div>
    </div></div>

    <article class="card hero s12">
      <div class="card-h">
        <div><h3>Контрфактический Симулятор «Что, если…» (Голубая — База, Зелёный пунктир — После правил ИИ-Лаб)</h3>
        <div class="sub">Применены: Переход Market → Maker Limit (+${fmtUsd0(makerSave)}), обрезка стопа на −${surv.optStop}R (+${fmtUsd0(surv.stopGain)}) и отключение токсичного кластера</div></div>
        <button class="btn primary" type="button" id="btnExportTensor">🤖 Скачать ai_research_tensor.json</button>
      </div>
      <div class="ch-md"><div id="cWhatIf" class="cv"></div></div>
    </article>

    <article class="card s6">
      <div class="card-h"><div><h3>🟢 Золотые подпространства (PRIM Split-Half Invariant)</h3><div class="sub">Закономерности, дающие прибыль И в 1-й, И во 2-й половине истории</div></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Найденное правило (Тождество)</th><th class="r">Сделок</th><th class="r">WinRate</th><th class="r">Чистый PnL</th></tr></thead><tbody>
        ${sg.golden.length?sg.golden.map(g=>`<tr><td><b>${esc(g.rule)}</b></td><td class="r">${g.n}</td><td class="r">${g.wr}%</td><td class="r up"><b>+${fmtUsd0(g.tot)}</b></td></tr>`).join(''):'<tr><td colspan="4" class="mute">В текущей выборке нет устойчивых плюсовых кластеров (требуется снижение трения CRR)</td></tr>'}
      </tbody></table></div>
    </article>

    <article class="card s6">
      <div class="card-h"><div><h3>🔴 Токсичные кластеры (Кандидаты на блокировку в конфиге)</h3><div class="sub">Устойчивые генераторы убытка в обеих половинах истории</div></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Токсичное условие</th><th class="r">Сделок</th><th class="r">WinRate</th><th class="r">Убыток</th></tr></thead><tbody>
        ${sg.toxic.length?sg.toxic.map(g=>`<tr><td><b>${esc(g.rule)}</b></td><td class="r">${g.n}</td><td class="r">${g.wr}%</td><td class="r down"><b>${fmtUsd0(g.tot)}</b></td></tr>`).join(''):'<tr><td colspan="4" class="mute">Токсичных сегментов не обнаружено</td></tr>'}
      </tbody></table></div>
    </article>
  </div>`;

  drawLineSvg('cWhatIf', s.eq, cfEq, '#34d399');
  $('#btnExportTensor').onclick=()=>{
    const tensor={generated_at:new Date().toISOString(),trades:tr.length,net_pnl:s.net,gross_pnl:s.gross,costs:s.costs,avg_crr_pct:+avgCrr.toFixed(2),dsr,survival_kaplan_meier:surv,prim_split_half:sg};
    download('ai_research_tensor.json',JSON.stringify(tensor,null,2),'application/json');
    toast('Слепок ai_research_tensor.json сохранён!');
  };
}

function renderPnl(){
  const s=S.st, tr=S.view, el=$('#view-pnl');
  const byTok=[...groupBy(tr,t=>t.token)].map(([k,g])=>[k,stats(g,0)]).sort((a,b)=>b[1].net-a[1].net);
  el.innerHTML=`<div class="grid">
    <div class="s12"><div class="tiles">
      <div class="tile"><div class="lbl">Gross Edge (До издержек)</div><div class="val ${s.gross>=0?'up':'down'}">${fmtUsd0(s.gross,{sign:1})}</div></div>
      <div class="tile"><div class="lbl">Комиссии биржи</div><div class="val down">−${fmtUsd0(s.fees)}</div></div>
      <div class="tile"><div class="lbl">Проскальзывание</div><div class="val warn">−${fmtUsd0(s.slip)}</div></div>
      <div class="tile"><div class="lbl">Чистый Net PnL</div><div class="val ${s.net>=0?'up':'down'}">${fmtUsd0(s.net,{sign:1})}</div></div>
    </div></div>
    <article class="card s12"><div class="card-h"><h3>Атрибуция по инструментам (Gross vs Издержки vs Net)</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Токен</th><th class="r">Сделок</th><th class="r">Gross Edge</th><th class="r">Издержки</th><th class="r">Net PnL</th><th class="r">WinRate</th><th class="r">PF</th></tr></thead><tbody>
        ${byTok.map(([k,x])=>`<tr><td><b>${esc(k)}</b></td><td class="r">${x.n}</td><td class="r ${x.gross>=0?'up':'down'}">${fmtUsd0(x.gross,{sign:1})}</td><td class="r warn">−${fmtUsd0(x.costs)}</td><td class="r ${x.net>=0?'up':'down'}"><b>${fmtUsd0(x.net,{sign:1})}</b></td><td class="r">${x.winRate.toFixed(1)}%</td><td class="r">${fmtPF(x.pf)}</td></tr>`).join('')}
      </tbody></table></div>
    </article>
  </div>`;
}

function renderLosses(){
  const tr=S.view, losers=tr.filter(t=>t.net<0), el=$('#view-losses');
  const byReason=[...groupBy(losers,t=>t.reason)].map(([k,g])=>[k,g.length,-sum(g,t=>t.net)]).sort((a,b)=>b[2]-a[2]);
  el.innerHTML=`<div class="grid"><article class="card s12"><div class="card-h"><h3>Анатомия убытков по причинам выхода</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Причина выхода</th><th class="r">Убыточных сделок</th><th class="r">Сумма убытка</th></tr></thead><tbody>
      ${byReason.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td class="r">${r[1]}</td><td class="r down"><b>−${fmtUsd0(r[2])}</b></td></tr>`).join('')}
    </tbody></table></div></article></div>`;
}

function renderTrades(){
  const tr=S.view, el=$('#view-trades');
  el.innerHTML=`<div class="grid"><article class="card s12"><div class="card-h"><h3>Журнал сделок (показано до 100 записей)</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Токен</th><th>Сторона</th><th>Ордер</th><th class="r">Gross</th><th class="r">Издержки</th><th class="r">Net PnL</th><th class="r">R</th><th class="r">MAE / MFE</th><th>Выход</th></tr></thead><tbody>
      ${tr.slice().reverse().slice(0,100).map(t=>`<tr><td class="dim">${esc(t.id)}</td><td><b>${esc(t.token)}</b></td><td class="${t.dir==='long'?'up':'down'}">${t.dir.toUpperCase()}</td><td>${esc(t.order)}</td><td class="r">${fmtUsd(t.gross,{sign:1})}</td><td class="r warn">−${fmtUsd(t.fees+t.slip)}</td><td class="r ${t.net>=0?'up':'down'}"><b>${fmtUsd(t.net,{sign:1})}</b></td><td class="r">${fmtR(t.r)}</td><td class="r mute">${t.mae}R / ${t.mfe}R</td><td class="mute">${esc(t.reason)}</td></tr>`).join('')}
    </tbody></table></div></article></div>`;
}

function recompute(){
  let tr=S.all;
  if(S.dir!=='all') tr=tr.filter(t=>t.dir===S.dir);
  if(S.tokens.size) tr=tr.filter(t=>S.tokens.has(t.token));
  S.view=tr; S.st=stats(tr,S.capital);
  $('#rangeLine').textContent=`${S.source==='file'?S.fileName:'Демо-данные'}: ${tr.length} сделок`;
  $$('.rail-btn').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  renderActiveTab();
}

function switchTab(id){
  S.tab=id;
  TABS.forEach(([t])=>$('#view-'+t).hidden=t!==id);
  $$('.rail-btn').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));
  renderActiveTab();
}

function renderActiveTab(){
  const id=S.tab, el=$('#view-'+id); el.hidden=false;
  if(!S.view.length){ el.innerHTML='<div class="card"><div class="empty">Нет сделок для выбранных фильтров</div></div>'; return; }
  ({overview:renderOverview, ailab:renderAiLab, pnl:renderPnl, losses:renderLosses, trades:renderTrades})[id]();
}

function loadRaw(raw,source,name){
  const T=normalize(raw);
  if(!T.length){ toast('Не удалось распознать сделки в файле'); return; }
  S.all=T; S.source=source; S.fileName=name||''; S.tokens=new Set();
  const toks=[...new Set(T.map(t=>t.token))].sort();
  $('#tokenChips').innerHTML=toks.map(t=>`<button type="button" class="tchip" data-t="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('');
  recompute();
}

window.addEventListener('DOMContentLoaded',()=>{
  $('#rail').innerHTML=`<div class="rail-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg></div>`+
    TABS.map(([id,l,svg])=>`<button class="rail-btn" role="tab" data-tab="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${svg}</svg><span>${l}</span></button>`).join('');
  $('#views').innerHTML=TABS.map(([id])=>`<section id="view-${id}" hidden></section>`).join('');
  $$('.rail-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  $('#segDir').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.dir=b.dataset.v;$$('#segDir button').forEach(x=>x.setAttribute('aria-pressed',x===b));recompute()};
  $('#tokenChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;S.tokens.has(t)?S.tokens.delete(t):S.tokens.add(t);b.setAttribute('aria-pressed',S.tokens.has(t));recompute()};
  $('#capital').onchange=e=>{const v=+e.target.value;if(v>0){S.capital=v;recompute()}};
  $('#btnDemo').onclick=()=>{S.seed++;loadRaw(genDemo(S.seed),'demo','Демо-выборка');toast('Сгенерирована новая выборка')};
  $('#btnDlSelf').onclick=()=>download('Quant_Analytics_Dashboard_v2_2_Lab.html','<!DOCTYPE html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8');
  $('#fileInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const txt=String(r.result).trim();
        const arr=(txt.startsWith('[')||txt.startsWith('{'))?(JSON.parse(txt).trades||JSON.parse(txt)):parseCSV(txt);
        loadRaw(arr,'file',f.name); toast('Файл загружен: '+f.name);
      }catch(err){toast('Ошибка чтения: '+err.message)}
    };
    r.readAsText(f);
  };
  loadRaw(genDemo(S.seed),'demo','Демо-выборка');
  switchTab('ailab');
});
</script>
