<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Engine: аналитика торгового робота + ИИ-Лаборатория v16</title>
<style>
:root{
  --bg:#050912; --glass:rgba(14,23,41,.62); --glass-2:rgba(255,255,255,.035);
  --line:rgba(148,197,255,.10); --line-2:rgba(34,211,238,.26);
  --text:#e6edf7; --mute:#8d9db7; --dim:#7a89a4;--sel:#2563eb;--sel-text:#8dbbff;--up-rgb:52,211,153;--down-rgb:251,113,133;
  --cyan:#22d3ee; --azure:#3b82f6; --up:#34d399; --down:#fb7185; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 520px at 6% -6%,rgba(34,211,238,.10),transparent 62%),
  radial-gradient(820px 620px at 104% 104%,rgba(59,130,246,.13),transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh;position:relative}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-right:1px solid var(--line);background:rgba(6,12,24,.6);backdrop-filter:blur(18px);z-index:20}
.rail-logo{width:42px;height:42px;margin-bottom:14px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,rgba(34,211,238,.22),rgba(59,130,246,.18));border:1px solid var(--line-2);box-shadow:0 0 24px -4px rgba(34,211,238,.45)}
.rail-btn{width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;color:var(--mute);background:none;border:0;font-size:12px;line-height:1.2;text-align:center}
.rail-btn svg{width:20px;height:20px}
.rail-btn:hover{color:var(--text)}
.rail-btn[aria-selected="true"]{color:var(--sel-text);background:linear-gradient(90deg,rgba(37,99,235,.26),rgba(37,99,235,.03));box-shadow:inset 2px 0 0 #3b82f6}
.main{padding:20px 28px 40px;max-width:1720px;width:100%;margin:0 auto;position:relative;z-index:1}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--glass-2);color:var(--mute)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn)}
.chip.live{color:var(--up);border-color:rgba(var(--up-rgb),.28);background:rgba(var(--up-rgb),.07)}
.chip.live i{background:var(--up);box-shadow:0 0 10px var(--up)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);color:var(--text);font-weight:500;font-size:12.5px;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(148,197,255,.22)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);border-color:transparent;box-shadow:0 6px 20px -6px rgba(59,130,246,.6)}
.btn.danger{border-color:rgba(var(--down-rgb),.5);color:var(--down)}
.btn[hidden]{display:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;width:100%;position:sticky;top:0;z-index:15;margin:0 0 14px;padding:10px 0;background:rgba(5,9,18,.88);backdrop-filter:blur(14px)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
.seg button,.tchip{border:0;background:none;color:var(--mute);padding:5px 13px;border-radius:999px;font-weight:500;font-size:12px;transition:color .15s,background .15s}
.seg button:hover,.tchip:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff;box-shadow:0 4px 14px -2px rgba(59,130,246,.55)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;max-height:92px;overflow:auto}
.tchip{border:1px solid var(--line);background:var(--glass-2)}
.tchip[aria-pressed="true"]{color:var(--sel-text);border-color:rgba(141,187,255,.45);background:rgba(37,99,235,.2)}
.field{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:12px}
.field input{width:104px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);outline:none;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(18px);min-width:0;position:relative}
.card.hero{border-color:rgba(34,211,238,.24);box-shadow:0 0 70px -24px rgba(34,211,238,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.005em}
.card .sub{color:var(--mute);font-size:12px;margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tile{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;min-width:0}
.tile .lbl{color:var(--mute);font-size:12px}
.tile .val{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:3px 0 1px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--glass-2)}
.badge.down{color:var(--down);border-color:rgba(var(--down-rgb),.32);background:rgba(var(--down-rgb),.09)}
.badge.warn{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.badge.low{color:var(--cyan);border-color:var(--line-2);background:rgba(34,211,238,.07)}
.badge.up{color:var(--up);border-color:rgba(var(--up-rgb),.3);background:rgba(var(--up-rgb),.08)}
.kpi{padding:16px 16px 0;overflow:hidden;display:flex;flex-direction:column}
.kpi .lbl{color:var(--mute);font-size:12.5px}
.kpi-val{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.2}
.kpi-sub{font-size:12px;color:var(--mute);min-height:18px}
.delta{font-weight:600}.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.spark{display:block;width:calc(100% + 32px);height:38px;margin:8px -16px 0}
.ch-main{height:290px;position:relative}.ch-bars{height:78px;position:relative;margin-top:2px}.ch-md{height:260px;position:relative}.ch-sm{height:320px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.legend i.g{background:repeating-linear-gradient(90deg,#b9c4d6 0 5px,transparent 5px 8px);box-shadow:none}
.legend i.l{height:10px;width:16px;border-radius:3px;background:rgba(251,191,36,.5);box-shadow:none}.legend i.b{height:12px;width:8px;border-radius:2px;background:linear-gradient(var(--up) 50%,var(--down) 50%);box-shadow:none}
.eq-val{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(34,211,238,.45))}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:34px;font-weight:650;letter-spacing:-.03em;line-height:1}
.ring .c span{font-size:12px;color:var(--mute);margin-top:3px}
.parts{flex:1;display:grid;gap:9px;min-width:0}
.part{display:grid;gap:4px;font-size:12px}
.part div:first-child{display:flex;justify-content:space-between;color:var(--mute)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--azure),var(--cyan))}
.link{border:0;background:none;color:var(--sel-text);font-weight:600;font-size:12.5px;padding:0}
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid rgba(148,197,255,.06)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 55% / .16);color:hsl(var(--h) 80% 72%);border:1px solid hsl(var(--h) 70% 60% / .28)}
.row .t{font-weight:600}.row .m{font-size:12px;color:var(--mute)}.row .v{font-weight:600;text-align:right}
.insight{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid rgba(148,197,255,.06)}
.insight .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--cyan);box-shadow:0 0 10px currentColor}
.insight .dot.up{background:var(--up);color:var(--up)}.insight .dot.down{background:var(--down);color:var(--down)}.insight .dot.warn{background:var(--warn);color:var(--warn)}
.rowbar{display:grid;grid-template-columns:34px 112px minmax(0,1fr) 88px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(148,197,255,.06)}
.rowbar .v{text-align:right;font-weight:600}.rowbar .bar i.neg{background:var(--down)}
.bn-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px}
.bn-head h2{font-size:21px;font-weight:650;letter-spacing:-.015em;margin:10px 0 4px;max-width:720px}
.bn-nums{display:flex;gap:34px}
.tile h4{font-size:13px;font-weight:600;margin-bottom:8px}
.tile ul{list-style:none;display:grid;gap:7px;color:#c3cee0}
.tile li{padding-left:14px;position:relative}
.tile li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{position:sticky;top:0;color:var(--mute);font-weight:500;font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(10,17,32,.9)}
th button{background:none;border:0;color:inherit;font-weight:inherit;display:inline-flex;gap:5px;align-items:center}
td{padding:9px 12px;border-bottom:1px solid rgba(148,197,255,.06);white-space:nowrap}
td.r,th.r{text-align:right}
.cell-bar{display:flex;align-items:center;gap:10px;min-width:240px}.cell-bar .bar{flex:1;min-width:120px}.cell-bar .bar i{background:linear-gradient(90deg,#f43f5e,var(--down))}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{position:relative}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.search input{width:240px;padding:7px 14px 7px 34px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);outline:none}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--mute)}
.pager button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass-2)}
.heat{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:5px;font-size:12px}
.heat .h{color:var(--dim);text-align:center;align-self:center}
.heat .c{height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.04)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.empty{text-align:center;padding:64px 20px;color:var(--mute)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.donut{position:relative;height:200px}.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .c b{font-size:28px;font-weight:650}.donut .c span{color:var(--mute);font-size:12px}
.toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:360px;padding:12px 16px;border-radius:14px;background:rgba(9,16,30,.95);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}.toast.err{border-color:rgba(var(--down-rgb),.45)}
.cv,.cv-s{position:absolute;inset:0}.cv svg{display:block;overflow:visible}
.tip{position:absolute;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;background:rgba(8,14,28,.96);border:1px solid rgba(34,211,238,.3);border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.55;color:#c3cee0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.notice{display:grid;gap:8px;margin-bottom:14px}.notice:empty{display:none}
.nt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2)}
.nt.info{border-color:rgba(141,187,255,.38);background:rgba(37,99,235,.13)}.nt.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}.nt.ok{border-color:rgba(var(--up-rgb),.32);background:rgba(var(--up-rgb),.07)}
.nt .acts{display:flex;gap:8px;flex-wrap:wrap}.nt .acts button{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:5px 13px;color:var(--sel-text);font-weight:500;font-size:12.5px}
.busypill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:none;padding:8px 18px;border-radius:999px;background:rgba(9,16,30,.97);border:1px solid var(--line-2)}
body.busy .busypill{display:block}
dialog{margin:auto;border:1px solid var(--line-2);border-radius:20px;background:#0b1220;color:var(--text);padding:22px 24px;max-width:min(780px,calc(100vw - 28px));width:100%}
dialog .row-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
body.cvd{--up:#3b9bff;--down:#ff9f43;--warn:#b794f6;--up-rgb:59,155,255;--down-rgb:255,159,67}
.mctl,.sheet-h,.backdrop,.jsel,.jcards{display:none}
.range{color:var(--mute);font-size:12px;margin-top:1px}
.stack{display:grid;gap:16px;align-content:start}
.focus-card{border-color:rgba(var(--down-rgb),.32);background:linear-gradient(135deg,rgba(var(--down-rgb),.11),var(--glass))}
.focus-card.ok{border-color:rgba(var(--up-rgb),.3);background:linear-gradient(135deg,rgba(var(--up-rgb),.1),var(--glass))}
.term{display:inline;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:help;border-bottom:1px dotted rgba(141,187,255,.55)}
.term i{font-style:normal;color:var(--sel-text);font-size:12px;margin-left:4px}
#gtip{position:fixed;z-index:70;max-width:270px;padding:10px 12px;border-radius:11px;background:rgba(8,14,28,.97);border:1px solid rgba(141,187,255,.35);color:#c3cee0;font-size:12.5px;opacity:0;pointer-events:none}
#gtip.show{opacity:1}
.bar.div{position:relative;overflow:visible}.bar.div::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(230,237,247,.35)}
.bar.div i{position:absolute;top:0;bottom:0}.bar.div i.pos{left:50%;border-radius:0 99px 99px 0;background:var(--up)}.bar.div i.neg{right:50%;border-radius:99px 0 0 99px}
.hlegend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--mute)}
.hlegend i{flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(var(--down-rgb),.85),rgba(var(--down-rgb),.12) 44%,rgba(255,255,255,.05) 50%,rgba(var(--up-rgb),.12) 56%,rgba(var(--up-rgb),.85))}
.bn3{grid-template-columns:1.35fr 1fr 1fr}.tile.act{border-color:rgba(141,187,255,.4);background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(255,255,255,.03))}
.card.fill{display:flex;flex-direction:column}.card.fill .ch-sm{flex:1;height:auto;min-height:300px}
@media (max-width:1100px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.s2,.s3{grid-column:span 6}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.bn3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" role="tablist" aria-label="Разделы дашборда" id="rail"></nav>
  <div class="main">
    <header class="topbar">
      <div class="brand">
        <div><h1>Quant Engine</h1><div class="range" id="rangeLine"></div></div>
        <span class="chip" id="statusChip"><i></i><span>Демо-данные</span></span>
      </div>
      <div class="mctl">
        <button class="btn" id="btnFilters" type="button" aria-expanded="false" aria-controls="filters"></button>
        <button class="btn icon" id="btnMenu" type="button" aria-expanded="false" aria-controls="actions" aria-label="Ещё"></button>
      </div>
      <div class="actions" id="actions">
        <button class="btn" id="btnDemo" type="button"></button>
        <button class="btn" id="btnSample" type="button"></button>
        <button class="btn" id="btnFormat" type="button"></button>
        <button class="btn" id="btnForget" type="button" hidden></button>
        <label class="btn primary" tabindex="0" id="btnUpload"><span class="ic"></span><span>Загрузить JSON или CSV</span><input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden></label>
      </div>
    </header>
    <div class="backdrop" id="backdrop"></div>
    <div class="filters" id="filters" aria-label="Фильтры">
      <div class="sheet-h"><b>Фильтры</b><button class="btn" type="button" id="btnDone">Готово</button></div>
      <div class="seg" id="segPeriod" role="group" aria-label="Период">
        <button type="button" data-v="7">7 дней</button><button type="button" data-v="30">30 дней</button><button type="button" data-v="all" aria-pressed="true">Всё время</button>
      </div>
      <div class="seg" id="segDir" role="group" aria-label="Сторона">
        <button type="button" data-v="all" aria-pressed="true">Long и Short</button><button type="button" data-v="long">Long</button><button type="button" data-v="short">Short</button>
      </div>
      <div class="tchips" id="tokenChips" role="group" aria-label="Токены"></div>
      <button type="button" class="tchip" id="btnReset" hidden></button>
      <label class="field">Капитал счёта, $<input type="number" id="capital" value="10000" min="1" step="100"></label>
      <button type="button" class="tchip" id="btnCvd" aria-pressed="false">Палитра для дальтоников</button>
    </div>
    <div class="notice" id="notice"></div>
    <div id="views"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>
<div class="busypill" role="status">Считаю…</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<!-- PART 2 & 3 SCRIPTS WILL BE APPENDED BELOW -->
</body>
</html>
